<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SMART-POS v2 · ตรวจการเชื่อมต่อ Supabase</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#eef0f2;--panel:#fff;--ink:#1d2329;--mute:#66707a;--line:#d5d9de;--tag:#f2b705;--tagink:#2a2100;--ok:#1b7f4b;--bad:#b3261e;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15191d;--panel:#1e2429;--ink:#e8ecef;--mute:#98a3ad;--line:#333c44;--ok:#4cc38a;--bad:#ff8a80;color-scheme:dark}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Sarabun,system-ui,"Noto Sans Thai",sans-serif}
main{max-width:720px;margin:0 auto;padding:14px;display:grid;gap:12px}
section{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
h1{font-size:19px;margin:0 0 4px}h2{font-size:16px;margin:0 0 8px}p{margin:4px 0;color:var(--mute)}
input,button{font:inherit;color:inherit;width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);margin-top:8px}
button{cursor:pointer;font-weight:700}button.pri{background:var(--tag);color:var(--tagink);border-color:var(--tag)}
button:disabled{opacity:.4}:focus-visible{outline:3px solid var(--tag);outline-offset:1px}
ul{list-style:none;margin:0;padding:0}li{padding:8px 0;border-bottom:1px solid var(--line);display:flex;gap:10px}
li:last-child{border:0}.i{width:22px;flex:none;font-weight:700}.ok .i{color:var(--ok)}.no .i{color:var(--bad)}.w .i{color:var(--tag)}
li small{display:block;color:var(--mute);word-break:break-word}
pre{white-space:pre-wrap;background:var(--bg);padding:10px;border-radius:8px;font-size:13px;overflow-x:auto;margin:6px 0 0}
</style>
</head>
<body>
<main>
<section>
  <h1>ตรวจการเชื่อมต่อ SMART-POS v2</h1>
  <p>ตรวจว่าสคีมา ข้อมูลที่ย้าย และฟังก์ชันขายทำงานครบ และวัดความเร็วโหลดสินค้า</p>
  <div id="login">
    <input id="em" type="email" autocomplete="username" placeholder="อีเมลผู้ใช้ (สร้างใน Authentication → Users)" aria-label="อีเมล">
    <input id="pw" type="password" autocomplete="current-password" placeholder="รหัสผ่าน" aria-label="รหัสผ่าน">
    <button class="pri" id="go">เข้าสู่ระบบและตรวจ</button>
  </div>
  <div id="who" style="display:none"><span id="whot"></span><button id="out">ออกจากระบบ</button></div>
</section>
<section id="res" style="display:none"><h2>ผลตรวจ</h2><ul id="ul"></ul><div id="help"></div></section>
<section id="tst" style="display:none"><h2>ทดสอบฟังก์ชันขาย</h2>
  <p>ขายสินค้า 1 หน่วยแล้วกลับรายการทันที สต็อกต้องกลับเท่าเดิม และส่งซ้ำด้วยรหัสเดิมต้องไม่ซ้ำบิล (ทิ้งเอกสารไว้ 2 ใบ)</p>
  <button id="t1">ทดสอบ post_doc</button></section>
</main>
<script>
const URL_="https://xobdkddyvbgalrvlljha.supabase.co";
const KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhvYmRrZGR5dmJnYWxydmxsamhhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU3MzE2NDAsImV4cCI6MjExMTMwNzY0MH0.JwIPgOW5ocpQ4Pksachy9mmm3nVjKPfKTRsmCXijr9U"; // anon key (สาธารณะได้) — ห้ามใส่ service_role
const sb=supabase.createClient(URL_,KEY),$=s=>document.querySelector(s);
const add=(k,t,d)=>$("#ul").insertAdjacentHTML("beforeend",`<li class="${k}"><span class="i">${k==="ok"?"✓":k==="no"?"✗":"!"}</span><span>${t}${d?`<small>${d}</small>`:""}</span></li>`);
const ms=t=>Math.round(performance.now()-t)+" ms";
let cat={skus:[],units:[]};
async function page(table,cols){let all=[],from=0;for(;;){const{data,error}=await sb.from(table).select(cols).order("id").range(from,from+999);if(error)throw error;all=all.concat(data);if(data.length<1000)break;from+=1000}return all}
async function check(){
  $("#res").style.display="block";$("#ul").innerHTML="";$("#help").innerHTML="";
  const{data:{user}}=await sb.auth.getUser();add("ok","เข้าสู่ระบบแล้ว",user.email);
  for(const t of ["products","skus","units","categories","parties","docs","stock_moves"]){
    const{count,error}=await sb.from(t).select("*",{count:"exact",head:true});
    error?add("no",`ตาราง ${t}`,error.message+(error.code==="42P01"||/schema cache/.test(error.message)?" — ยังไม่ได้รัน smart-pos-v2-schema.sql ?":"")):add(count?"ok":"w",`ตาราง ${t}: ${count} แถว`,count?"":"ว่าง — ถ้าเป็นสินค้า/หน่วย ให้รัน smart-pos-v2-migrate.sql");
  }
  const{data:me,error:e1}=await sb.rpc("me");
  if(e1||!me||!me.id){add("no","ผู้ใช้นี้ยังไม่มีสิทธิ์ใน app_users",e1?e1.message:"");
    $("#help").innerHTML=`<p>รันใน SQL Editor แล้วตรวจซ้ำ:</p><pre>insert into app_users(auth_id,name,role)\nselect id,'เจ้าของ','OWNER' from auth.users where email='${user.email}';</pre>`;return}
  add("ok","สิทธิ์ผู้ใช้: "+me.role,me.name);
  let t=performance.now();
  try{cat.skus=await page("skus","id,code,variant,barcode,base_unit,cost,stock,product_id");cat.units=await page("units","id,sku_id,name,ratio,price");
    add("ok",`โหลดสินค้า ${cat.skus.length} รายการ + ${cat.units.length} หน่วย ใน ${ms(t)}`,"ค้นหา/เลือกหลังจากนี้ทำในเครื่อง ไม่รอเครือข่าย")}catch(e){add("no","โหลดสินค้าไม่สำเร็จ",e.message)}
  const{data:bad,error:e2}=await sb.from("stock_check").select("code,stock,ledger").limit(5);
  e2?add("no","view stock_check",e2.message):add(bad.length?"no":"ok",bad.length?"สต็อกไม่ตรงสมุดบัญชี":"สต็อกตรงกับสมุดบัญชี ทุกรายการ",bad.length?JSON.stringify(bad):"");
  const noUnit=cat.skus.filter(s=>!cat.units.some(u=>u.sku_id===s.id)).length;
  add(noUnit?"w":"ok",noUnit?`สินค้า ${noUnit} รายการไม่มีหน่วยขาย`:"ทุกสินค้ามีหน่วยขาย");
  $("#tst").style.display="block";
}
async function testDoc(){
  const b=$("#t1");b.disabled=true;$("#ul").insertAdjacentHTML("beforeend","");
  try{
    const s=cat.skus.find(x=>+x.stock>=1&&cat.units.some(u=>u.sku_id===x.id&&+u.ratio===1&&+u.price>=0));
    if(!s)return add("w","ไม่มีสินค้าที่มีสต็อกให้ทดสอบ");
    const u=cat.units.find(x=>x.sku_id===s.id&&+x.ratio===1),cid="test-"+crypto.randomUUID(),lines=[{sku_id:s.id,unit_id:u.id,qty:1}];
    const stock=async()=>(await sb.from("skus").select("stock").eq("id",s.id).single()).data.stock;
    const s0=+await stock(),t=performance.now();
    let r=await sb.rpc("post_doc",{p_client_id:cid,p_type:"SALE",p_lines:lines});if(r.error)throw r.error;
    add("ok",`ขาย ${s.code} 1 ${u.name} ได้เลขที่ ${r.data.doc_no} ใน ${ms(t)}`,`ยอด ${r.data.total}`);
    const s1=+await stock();add(s1===s0-+u.ratio?"ok":"no",`สต็อกลดถูกต้อง (${s0} → ${s1})`);
    const r2=await sb.rpc("post_doc",{p_client_id:cid,p_type:"SALE",p_lines:lines});
    add(r2.data&&r2.data.dup&&r2.data.id===r.data.id?"ok":"no","ส่งซ้ำด้วยรหัสเดิม ไม่เกิดบิลซ้ำ",r2.error?r2.error.message:"");
    const r3=await sb.rpc("post_doc",{p_client_id:"void-"+cid,p_type:"VOID",p_ref_doc:r.data.id});if(r3.error)throw r3.error;
    const s2=+await stock();add(s2===s0?"ok":"no",`กลับรายการแล้วสต็อกกลับเท่าเดิม (${s2})`);
  }catch(e){add("no","post_doc ผิดพลาด",e.message||JSON.stringify(e))}finally{b.disabled=false}
}
async function enter(){$("#login").style.display="none";$("#who").style.display="block";const{data:{user}}=await sb.auth.getUser();$("#whot").textContent="ผู้ใช้: "+user.email;await check()}
$("#go").onclick=async()=>{$("#go").disabled=true;const{error}=await sb.auth.signInWithPassword({email:$("#em").value.trim(),password:$("#pw").value});
  $("#go").disabled=false;if(error){$("#res").style.display="block";$("#ul").innerHTML="";return add("no","เข้าสู่ระบบไม่ได้",error.message)}enter()};
$("#out").onclick=async()=>{await sb.auth.signOut();location.reload()};
$("#t1").onclick=testDoc;
sb.auth.getSession().then(({data})=>{if(data.session)enter()});
</script>
</body>
</html>
