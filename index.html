<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SMART-POS v2 · ขาย</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#eef0f2;--panel:#fff;--ink:#1d2329;--mute:#66707a;--line:#d5d9de;--tag:#f2b705;--tagink:#2a2100;--ok:#1b7f4b;--bad:#b3261e;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15191d;--panel:#1e2429;--ink:#e8ecef;--mute:#98a3ad;--line:#333c44;--ok:#4cc38a;--bad:#ff8a80;color-scheme:dark}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 Sarabun,system-ui,"Noto Sans Thai",sans-serif}
main{max-width:1100px;margin:0 auto;padding:12px;display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:860px){main{grid-template-columns:1.1fr 1fr}}
section{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;min-width:0}
h1{font-size:18px;margin:0 0 8px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
h1 small{font-weight:400;color:var(--mute);font-size:13px}
input,select,button{font:inherit;color:inherit}
#q,.lg input{width:100%;padding:12px;font-size:18px;border:2px solid var(--ink);border-radius:8px;background:var(--bg);margin-top:8px}
:focus-visible{outline:3px solid var(--tag);outline-offset:1px}
.res{list-style:none;margin:8px 0 0;padding:0;max-height:48vh;overflow:auto}
.res li{display:flex;justify-content:space-between;gap:8px;padding:9px 8px;border-bottom:1px solid var(--line);cursor:pointer}
.res li.on,.res li:hover{background:color-mix(in srgb,var(--tag) 28%,transparent)}
.res small,.hint{color:var(--mute)}.low{color:var(--bad)}.hint{font-size:13px;margin:8px 0 0}
table{width:100%;border-collapse:collapse}td{padding:8px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n{width:100%}td.r{text-align:right;white-space:nowrap}
.qty{display:inline-flex;align-items:center;gap:4px}
.qty button{width:32px;height:32px;border:1px solid var(--line);background:var(--bg);border-radius:6px;cursor:pointer}
.qty input{width:56px;text-align:center;padding:5px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
select{padding:6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);max-width:100px}
.x{border:0;background:none;color:var(--bad);cursor:pointer;font-size:18px}
.tot{display:flex;justify-content:space-between;align-items:baseline;margin:10px 0 4px}.tot strong{font-size:34px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.row button,.row input,.row select{flex:1;min-width:72px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);cursor:pointer}
.row input{cursor:text;text-align:right}
.pay,.lg button{width:100%;padding:14px;font-size:20px;font-weight:700;background:var(--tag);color:var(--tagink);border:0;border-radius:10px;cursor:pointer;margin-top:8px}
.pay:disabled,.lg button:disabled{opacity:.4;cursor:not-allowed}
.m.on{background:var(--ink)!important;color:var(--bg)}
#msg{min-height:22px;margin-top:8px;color:var(--ok);font-weight:600}#msg.err{color:var(--bad)}
.empty{color:var(--mute);padding:18px 4px;text-align:center}
#fail{display:none;margin-top:8px;color:var(--bad)}#fail li{margin:4px 0}
.lg{max-width:380px;margin:12vh auto;padding:0 14px}
</style>
</head>
<body>
<div class="lg" id="lg"><section><h1>SMART-POS v2</h1>
  <input id="em" type="email" autocomplete="username" placeholder="อีเมล" aria-label="อีเมล">
  <input id="pw" type="password" autocomplete="current-password" placeholder="รหัสผ่าน" aria-label="รหัสผ่าน">
  <button id="go">เข้าสู่ระบบ</button><div id="lerr" class="hint low" role="alert"></div></section></div>
<main id="app" style="display:none">
<section>
  <h1>ค้นหาสินค้า <small id="cnt"></small></h1>
  <input id="q" type="search" autocomplete="off" placeholder="พิมพ์ชื่อ รหัส หรือสแกนบาร์โค้ด แล้วกด Enter" aria-label="ค้นหาสินค้า">
  <ul class="res" id="res" role="listbox"></ul>
  <p class="hint">F2 ค้นหา · ↑↓ เลือก · Enter เพิ่มลงบิล · F8 บันทึกบิล · Esc ล้างบิล</p>
</section>
<section>
  <h1>บิลขาย <small id="sync"></small></h1>
  <table><tbody id="cart"></tbody></table>
  <div class="row"><input id="disc" inputmode="decimal" placeholder="ส่วนลด (บาท)" aria-label="ส่วนลด"></div>
  <div class="tot"><span>รวมทั้งสิ้น</span><strong id="total">0.00</strong></div>
  <div class="row" id="methods"><button class="m on" data-m="CASH">เงินสด</button><button class="m" data-m="TRANSFER">โอน</button><button class="m" data-m="CREDIT">ขายเชื่อ</button></div>
  <div class="row" id="credrow" style="display:none"><select id="party" aria-label="ลูกค้า"></select></div>
  <div class="row" id="cashrow"><input id="recv" inputmode="decimal" placeholder="รับเงิน" aria-label="เงินที่รับ"><button id="exact">พอดี</button><button id="r100">ปัดร้อย</button></div>
  <div class="tot"><span>เงินทอน</span><strong id="chg" style="font-size:22px">0.00</strong></div>
  <button class="pay" id="pay" disabled>บันทึกบิล (F8)</button>
  <div id="msg" role="status"></div>
  <details id="fail"><summary id="failn"></summary><ul id="faill"></ul><button id="failx">ล้างรายการที่ไม่สำเร็จ</button></details>
  <p class="hint"><span id="who"></span> · <a href="#" id="out">ออกจากระบบ</a></p>
</section>
</main>
<script>
const SB_URL="https://xobdkddyvbgalrvlljha.supabase.co";
const SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhvYmRrZGR5dmJnYWxydmxsamhhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU3MzE2NDAsImV4cCI6MjExMTMwNzY0MH0.JwIPgOW5ocpQ4Pksachy9mmm3nVjKPfKTRsmCXijr9U"; // anon key
const sb=supabase.createClient(SB_URL,SB_KEY),$=s=>document.querySelector(s);
const fmt=n=>(+n).toLocaleString("th-TH",{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid=()=>crypto.randomUUID?crypto.randomUUID():"10000000-1000-4000-8000-100000000000".replace(/[018]/g,c=>(c^(crypto.getRandomValues?crypto.getRandomValues(new Uint8Array(1))[0]:Math.random()*256)&15>>c/4).toString(16));
const ls={get:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let SK=[],IDX=[],BC=new Map(),PARTIES=[],cart=[],hits=[],sel=0,method="CASH";
// ===== แคตตาล็อก: แสดงจากแคชในเครื่องทันที แล้วรีเฟรชจากเซิร์ฟเวอร์เบื้องหลัง =====
function build(c){const P=new Map(c.p.map(r=>[r[0],r])),U=new Map();BC=new Map();
  c.u.forEach(r=>{const u={id:r[0],sku:r[1],n:r[2],r:+r[3],p:+r[4]};if(!U.has(r[1]))U.set(r[1],[]);U.get(r[1]).push(u);if(r[5])BC.set(r[5],{sku:r[1],u})});
  SK=c.s.map(r=>{const p=P.get(r[1])||[0,"","(ไม่มีกลุ่ม)"],us=(U.get(r[0])||[]).sort((a,b)=>(a.r!==1)-(b.r!==1)||b.r-a.r);
    const s={id:r[0],code:r[2],name:p[2],v:r[3]||"",bc:r[4]||"",stock:+r[6],units:us};if(r[4])BC.set(r[4],{sku:r[0],u:us[0]});return s}).filter(s=>s.units.length);
  const byId=new Map(SK.map(s=>[s.id,s]));BC.forEach(x=>x.sku=byId.get(x.sku));
  IDX=SK.map(s=>({s,t:(s.code+" "+s.name+" "+s.v+" "+s.bc).toLowerCase().replace(/["']/g,"")}));$("#cnt").textContent=SK.length+" รายการ"}
async function page(t,cols){let all=[],from=0;for(;;){const{data,error}=await sb.from(t).select(cols).order("id").range(from,from+999);if(error)throw error;all=all.concat(data);if(data.length<1000)break;from+=1000}return all}
async function refresh(){try{const[p,s,u,pt]=await Promise.all([page("products","id,code,name"),page("skus","id,product_id,code,variant,barcode,base_unit,stock"),page("units","id,sku_id,name,ratio,price,barcode"),sb.from("parties").select("id,name").eq("kind","CUSTOMER")]);
  const c={p:p.map(r=>[r.id,r.code,r.name]),s:s.map(r=>[r.id,r.product_id,r.code,r.variant,r.barcode,r.base_unit,r.stock]),u:u.map(r=>[r.id,r.sku_id,r.name,r.ratio,r.price,r.barcode])};
  ls.set("v2cat",c);ls.set("v2parties",pt.data||[]);build(c);parties(pt.data||[]);search();render();return true}catch(e){return false}}
function parties(a){PARTIES=a;$("#party").innerHTML='<option value="">เลือกลูกค้า</option>'+a.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("")}
// ===== ค้นหา/ตะกร้า =====
function search(){const w=$("#q").value.trim().toLowerCase().replace(/["']/g,"").split(/\s+/).filter(Boolean);
  hits=w.length?IDX.filter(x=>w.every(k=>x.t.includes(k))).map(x=>x.s).slice(0,30):SK.slice(0,10);sel=0;renderRes()}
function renderRes(){$("#res").innerHTML=hits.length?hits.map((s,i)=>`<li role="option" data-i="${i}" class="${i===sel?"on":""}"><span><b>${esc(s.name)}</b> <small>${esc(s.v)}</small><br><small>${esc(s.code)}</small></span><span class="r">${fmt(s.units[0].p)}<br><small class="${s.stock<=0?"low":""}">เหลือ ${s.stock}</small></span></li>`).join(""):'<li class="empty">ไม่พบสินค้า ลองพิมพ์คำสั้นลง</li>'}
function add(s,u){u=u||s.units[0];const L=cart.find(l=>l.s===s&&l.u===u);if(L)L.q++;else cart.push({s,u,q:1});$("#q").value="";search();render();$("#q").focus()}
const base=l=>l.q*l.u.r,sub=()=>cart.reduce((a,l)=>a+l.q*l.u.p,0),total=()=>Math.max(0,sub()-(parseFloat($("#disc").value)||0));
function render(){$("#cart").innerHTML=cart.length?cart.map((l,i)=>{const over=base(l)>l.s.stock;
  return `<tr><td class="n"><b>${esc(l.s.name)}</b> <small>${esc(l.s.v)}</small>${over?'<br><small class="low">สต็อกไม่พอ (เหลือ '+l.s.stock+')</small>':""}</td>
  <td><span class="qty"><button data-a="dec" data-i="${i}" aria-label="ลด">−</button><input value="${l.q}" data-a="set" data-i="${i}" inputmode="decimal" aria-label="จำนวน"><button data-a="inc" data-i="${i}" aria-label="เพิ่ม">+</button></span></td>
  <td><select data-a="unit" data-i="${i}" aria-label="หน่วย">${l.s.units.map((u,j)=>`<option value="${j}" ${u===l.u?"selected":""}>${esc(u.n)}</option>`).join("")}</select></td>
  <td class="r">${fmt(l.q*l.u.p)}</td><td><button class="x" data-a="del" data-i="${i}" aria-label="ลบ">×</button></td></tr>`}).join(""):'<tr><td class="empty">ยังไม่มีสินค้าในบิล สแกนหรือค้นหาด้านซ้าย</td></tr>';
  $("#total").textContent=fmt(total());calc()}
function calc(){const t=total(),r=parseFloat($("#recv").value)||0;$("#cashrow").style.display=method==="CASH"?"flex":"none";$("#credrow").style.display=method==="CREDIT"?"flex":"none";
  $("#chg").textContent=fmt(Math.max(0,r-t));
  $("#pay").disabled=!cart.length||(method==="CASH"&&$("#recv").value!==""&&r<t)||(method==="CREDIT"&&!$("#party").value);
  const n=ls.get("v2out",[]).length;$("#sync").textContent=n?n+" บิลรอส่ง":"ซิงก์แล้ว"}
// ===== บันทึกบิลลงคิวในเครื่องทันที แล้วส่ง post_doc เบื้องหลัง (กันซ้ำด้วย client_id) =====
function pay(){if($("#pay").disabled)return;const t0=performance.now(),tot=total();
  const doc={cid:uid(),pm:method,party:method==="CREDIT"?$("#party").value:null,disc:parseFloat($("#disc").value)||0,paid:method==="CREDIT"?0:null,tot,at:new Date().toLocaleString("th-TH"),
    lines:cart.map(l=>({sku_id:l.s.id,unit_id:l.u.id,qty:l.q}))};
  cart.forEach(l=>l.s.stock-=base(l));const o=ls.get("v2out",[]);o.push(doc);ls.set("v2out",o);
  cart=[];$("#recv").value="";$("#disc").value="";search();render();
  $("#msg").className="";$("#msg").textContent=`บันทึกบิล ${fmt(tot)} บาท ใน ${Math.round(performance.now()-t0)} มิลลิวินาที`;$("#q").focus();flush()}
let busy=false;
async function flush(){if(busy)return;busy=true;try{for(;;){const o=ls.get("v2out",[]);if(!o.length)break;const d=o[0];
  const{data,error}=await sb.rpc("post_doc",{p_client_id:d.cid,p_type:"SALE",p_party:d.party,p_discount:d.disc,p_pay_method:d.pm,p_paid:d.paid,p_lines:d.lines});
  if(error&&!error.code&&!error.hint&&/fetch|network|Failed/i.test(error.message))break;           // เครือข่ายล่ม: เก็บไว้ลองใหม่
  const rest=ls.get("v2out",[]).slice(1);ls.set("v2out",rest);
  if(error){const f=ls.get("v2fail",[]);f.push({at:d.at,tot:d.tot,err:error.message});ls.set("v2fail",f);$("#msg").className="err";$("#msg").textContent="มีบิลที่เซิร์ฟเวอร์ปฏิเสธ: "+error.message}}}
  finally{busy=false;calc();showFail()}}
function showFail(){const f=ls.get("v2fail",[]);$("#fail").style.display=f.length?"block":"none";$("#failn").textContent=f.length+" บิลไม่สำเร็จ (ต้องทำรายการใหม่)";
  $("#faill").innerHTML=f.map(x=>`<li>${esc(x.at)} · ${fmt(x.tot)} บาท — ${esc(x.err)}</li>`).join("")}
// ===== เหตุการณ์ =====
$("#q").addEventListener("input",search);
$("#q").addEventListener("keydown",e=>{if(e.key==="ArrowDown"){sel=Math.min(sel+1,hits.length-1);renderRes();e.preventDefault()}
  else if(e.key==="ArrowUp"){sel=Math.max(sel-1,0);renderRes();e.preventDefault()}
  else if(e.key==="Enter"){const v=e.target.value.trim(),b=BC.get(v);if(b&&b.sku)add(b.sku,b.u);else{const c=SK.find(s=>s.code.toLowerCase()===v.toLowerCase());if(c)add(c);else if(hits[sel]&&v)add(hits[sel])}}});
$("#res").addEventListener("click",e=>{const li=e.target.closest("li[data-i]");if(li)add(hits[+li.dataset.i])});
$("#cart").addEventListener("click",e=>{const b=e.target.closest("button[data-a]");if(!b)return;const l=cart[+b.dataset.i];
  if(b.dataset.a==="inc")l.q++;if(b.dataset.a==="dec")l.q=Math.max(1,l.q-1);if(b.dataset.a==="del")cart.splice(+b.dataset.i,1);render()});
$("#cart").addEventListener("change",e=>{const l=cart[+e.target.dataset.i];if(!l)return;
  if(e.target.dataset.a==="unit")l.u=l.s.units[+e.target.value];if(e.target.dataset.a==="set")l.q=Math.max(.01,parseFloat(e.target.value)||1);render()});
$("#methods").addEventListener("click",e=>{const b=e.target.closest(".m");if(!b)return;method=b.dataset.m;document.querySelectorAll(".m").forEach(x=>x.classList.toggle("on",x===b));calc()});
["recv","disc","party"].forEach(i=>$("#"+i).addEventListener("input",()=>{$("#total").textContent=fmt(total());calc()}));
$("#exact").onclick=()=>{$("#recv").value=total();calc()};$("#r100").onclick=()=>{$("#recv").value=Math.ceil(total()/100)*100;calc()};
$("#pay").onclick=pay;$("#failx").onclick=()=>{ls.set("v2fail",[]);showFail()};
document.addEventListener("keydown",e=>{if(e.key==="F2"){e.preventDefault();$("#q").focus()}if(e.key==="F8"){e.preventDefault();pay()}
  if(e.key==="Escape"){cart=[];$("#recv").value="";$("#disc").value="";render();$("#q").value="";search();$("#q").focus()}});
window.addEventListener("online",flush);
// ===== เข้าสู่ระบบ =====
async function start(user){$("#lg").style.display="none";$("#app").style.display="grid";$("#who").textContent=user.email;
  const c=ls.get("v2cat",null);if(c){build(c);parties(ls.get("v2parties",[]));search();render()}
  const ok=await refresh();if(!ok&&!c){$("#msg").className="err";$("#msg").textContent="โหลดสินค้าไม่ได้ ตรวจอินเทอร์เน็ตแล้วเปิดใหม่"}else if(!ok)$("#msg").textContent="ออฟไลน์ ใช้ข้อมูลสินค้าที่บันทึกไว้ในเครื่อง";
  showFail();flush();$("#q").focus()}
$("#go").onclick=async()=>{$("#go").disabled=true;$("#lerr").textContent="";const{data,error}=await sb.auth.signInWithPassword({email:$("#em").value.trim(),password:$("#pw").value});
  $("#go").disabled=false;if(error)return $("#lerr").textContent="เข้าสู่ระบบไม่ได้: "+error.message;start(data.user)};
$("#pw").addEventListener("keydown",e=>{if(e.key==="Enter")$("#go").click()});
$("#out").onclick=async e=>{e.preventDefault();await sb.auth.signOut();location.reload()};
sb.auth.getSession().then(({data})=>{if(data.session)start(data.session.user)});
</script>
</body>
</html>
