<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SMART-POS v2 · ขาย</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root {
  --bg: #eef0f2;
  --panel: #fff;
  --ink: #1d2329;
  --mute: #66707a;
  --line: #d5d9de;
  --tag: #f2b705;
  --tagink: #2a2100;
  --ok: #1b7f4b;
  --bad: #b3261e;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15191d;
    --panel: #1e2429;
    --ink: #e8ecef;
    --mute: #98a3ad;
    --line: #333c44;
    --ok: #4cc38a;
    --bad: #ff8a80;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.4 Sarabun, system-ui, "Noto Sans Thai", sans-serif;
}
main {
  max-width: 1240px;
  margin: 0 auto;
  padding: 12px;
  display: grid;
  gap: 12px;
  grid-template-columns: 1fr;
}
@media (min-width: 860px) {
  main { grid-template-columns: 1.25fr 1fr; }
}
section {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 12px;
  min-width: 0;
}
h1 {
  font-size: 18px;
  margin: 0 0 8px;
  display: flex;
  justify-content: space-between;
  gap: 8px;
  align-items: center;
}
h1 small {
  font-weight: 400;
  color: var(--mute);
  font-size: 13px;
}
input, select, button {
  font: inherit;
  color: inherit;
}
#q, .lg input {
  width: 100%;
  padding: 12px;
  font-size: 18px;
  border: 2px solid var(--ink);
  border-radius: 8px;
  background: var(--bg);
  margin-top: 4px;
}
:focus-visible {
  outline: 3px solid var(--tag);
  outline-offset: 1px;
}

/* ปุ่มสลับมุมมอง Grid / List */
.view-ctrl {
  display: inline-flex;
  gap: 4px;
  align-items: center;
}
.vbtn {
  padding: 4px 10px;
  font-size: 13px;
  border: 1px solid var(--line);
  background: var(--bg);
  border-radius: 6px;
  cursor: pointer;
}
.vbtn.on {
  background: var(--ink);
  color: var(--bg);
  border-color: var(--ink);
  font-weight: 600;
}

/* รายการสินค้า (รองรับทั้งแบบตารางการ์ดมีรูป และแบบรายการแถว) */
.res {
  list-style: none;
  margin: 10px 0 0;
  padding: 0;
  max-height: 64vh;
  overflow-y: auto;
}
.res.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
  gap: 8px;
}
.res.grid li {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 8px;
  background: var(--bg);
  cursor: pointer;
  transition: transform .08s ease;
}
.res.grid li:active {
  transform: scale(0.98);
}
.res.grid li.on, .res.grid li:hover {
  border-color: var(--tag);
  background: color-mix(in srgb, var(--tag) 18%, var(--bg));
}
.res.grid .thumb-box {
  width: 100%;
  aspect-ratio: 1 / 1;
  border-radius: 6px;
  overflow: hidden;
  background: var(--panel);
  border: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 6px;
  position: relative;
}
.res.grid .thumb-box img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.res.grid .no-img {
  font-size: 12px;
  color: var(--mute);
  text-align: center;
  padding: 4px;
  word-break: break-word;
}
.res.grid .stock-badge {
  position: absolute;
  top: 4px;
  right: 4px;
  font-size: 11px;
  font-weight: 600;
  padding: 1px 6px;
  border-radius: 4px;
  background: rgba(0, 0, 0, 0.72);
  color: #fff;
}
.res.grid .stock-badge.low {
  background: var(--bad);
}
.res.grid .p-title {
  font-size: 14px;
  font-weight: 700;
  line-height: 1.25;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.res.grid .p-meta {
  font-size: 12px;
  color: var(--mute);
  margin-top: 2px;
}
.res.grid .p-price {
  font-size: 16px;
  font-weight: 700;
  color: var(--ok);
  margin-top: 6px;
  text-align: right;
}

/* มุมมองแบบรายการ (List) พร้อมรูปย่อด้านซ้าย */
.res.list li {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 8px;
  border-bottom: 1px solid var(--line);
  cursor: pointer;
}
.res.list li.on, .res.list li:hover {
  background: color-mix(in srgb, var(--tag) 25%, transparent);
}
.res.list .list-left {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
  flex: 1;
}
.res.list .thumb-mini {
  width: 48px;
  height: 48px;
  flex-shrink: 0;
  border-radius: 6px;
  overflow: hidden;
  border: 1px solid var(--line);
  background: var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  color: var(--mute);
}
.res.list .thumb-mini img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.res small, .hint { color: var(--mute); }
.low { color: var(--bad); }
.hint { font-size: 13px; margin: 8px 0 0; }
table { width: 100%; border-collapse: collapse; }
td {
  padding: 8px 4px;
  border-bottom: 1px solid var(--line);
  vertical-align: middle;
}
td.n { width: 100%; }
td.r { text-align: right; white-space: nowrap; }
.cart-item-wrap {
  display: flex;
  align-items: center;
  gap: 8px;
}
.cart-thumb {
  width: 38px;
  height: 38px;
  border-radius: 5px;
  object-fit: cover;
  border: 1px solid var(--line);
  flex-shrink: 0;
  background: var(--bg);
}
.qty {
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.qty button {
  width: 32px;
  height: 32px;
  border: 1px solid var(--line);
  background: var(--bg);
  border-radius: 6px;
  cursor: pointer;
}
.qty input {
  width: 56px;
  text-align: center;
  padding: 5px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--bg);
}
select {
  padding: 6px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--bg);
  max-width: 100px;
}
.x {
  border: 0;
  background: none;
  color: var(--bad);
  cursor: pointer;
  font-size: 18px;
}
.tot {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin: 10px 0 4px;
}
.tot strong { font-size: 34px; }
.row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin: 8px 0;
}
.row button, .row input, .row select {
  flex: 1;
  min-width: 72px;
  padding: 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--bg);
  cursor: pointer;
}
.row input {
  cursor: text;
  text-align: right;
}
#party-input {
  text-align: left !important;
}
.pay, .lg button {
  width: 100%;
  padding: 14px;
  font-size: 20px;
  font-weight: 700;
  background: var(--tag);
  color: var(--tagink);
  border: 0;
  border-radius: 10px;
  cursor: pointer;
  margin-top: 8px;
}
.pay:disabled, .lg button:disabled {
  opacity: .4;
  cursor: not-allowed;
}
.m.on {
  background: var(--ink) !important;
  color: var(--bg);
}
#msg {
  min-height: 22px;
  margin-top: 8px;
  color: var(--ok);
  font-weight: 600;
}
#msg.err { color: var(--bad); }
.empty {
  color: var(--mute);
  padding: 18px 4px;
  text-align: center;
  grid-column: 1 / -1;
}
#fail {
  display: none;
  margin-top: 8px;
  color: var(--bad);
}
#fail li { margin: 4px 0; }
.lg {
  max-width: 380px;
  margin: 12vh auto;
  padding: 0 14px;
}
.act-bar {
  display: flex;
  gap: 8px;
  margin-top: 8px;
}
.btn-sub {
  flex: 1;
  padding: 8px 12px;
  font-size: 14px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--bg);
  cursor: pointer;
}
.btn-sub:disabled {
  opacity: .4;
  cursor: not-allowed;
}

/* ส่วนสำหรับพิมพ์ใบเสร็จ (แสดงเฉพาะตอนสั่งพิมพ์) */
#receipt-area { display: none; }
@media print {
  body {
    background: #fff !important;
    color: #000 !important;
    font-family: "Sarabun", monospace, sans-serif;
  }
  main, .lg { display: none !important; }
  #receipt-area {
    display: block !important;
    width: 100%;
    max-width: 80mm;
    margin: 0 auto;
    padding: 4px;
    font-size: 13px;
    line-height: 1.35;
  }
  #receipt-area h2 {
    text-align: center;
    font-size: 16px;
    margin: 0 0 4px;
  }
  #receipt-area .rc-meta {
    font-size: 11px;
    text-align: center;
    margin-bottom: 8px;
    border-bottom: 1px dashed #000;
    padding-bottom: 6px;
  }
  #receipt-area table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 6px;
  }
  #receipt-area td {
    padding: 3px 0;
    border: none;
    vertical-align: top;
  }
  #receipt-area .rc-line {
    border-top: 1px dashed #000;
    margin: 6px 0;
  }
  #receipt-area .rc-tot {
    display: flex;
    justify-content: space-between;
    font-weight: 700;
    font-size: 15px;
  }
  #receipt-area .rc-row {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
  }
  #receipt-area .rc-foot {
    text-align: center;
    font-size: 11px;
    margin-top: 10px;
  }
}
.res li.more { grid-column: 1 / -1; justify-content: center; text-align: center; color: var(--mute); cursor: pointer; padding: 12px; border: 1px dashed var(--line); border-radius: 8px; }
</style>
</head>
<body>

<div class="lg" id="lg">
  <section>
    <h1>SMART-POS v2</h1>
    <input id="em" type="email" autocomplete="username" placeholder="อีเมล" aria-label="อีเมล">
    <input id="pw" type="password" autocomplete="current-password" placeholder="รหัสผ่าน" aria-label="รหัสผ่าน">
    <button id="go">เข้าสู่ระบบ</button>
    <div id="lerr" class="hint low" role="alert"></div>
    <details id="cfg" style="margin-top:14px"><summary style="cursor:pointer">ฐานข้อมูล (Supabase)</summary>

    <button id="csave" type="button">บันทึกและเชื่อมต่อฐานนี้</button><button id="creset" type="button">ใช้ค่าเริ่มต้นของไฟล์</button>
    <span id="cinfo" style="display:block;margin-top:6px;font-size:13px;color:var(--mute)"></span></details>

</div>

<main id="app" style="display:none">
  <section>
    <h1>
      <span>รายการสินค้า <small id="cnt"></small></span>
      <span class="view-ctrl">
        <button type="button" class="vbtn on" id="v-grid" title="แสดงแบบตารางรูปภาพ">รูปภาพ</button>
        <button type="button" class="vbtn" id="v-list" title="แสดงแบบรายการ">รายการ</button>
      </span>
    </h1>
    <input id="q" type="search" autocomplete="off" placeholder="พิมพ์ชื่อ รหัส หรือสแกนบาร์โค้ด แล้วกด Enter" aria-label="ค้นหาสินค้า">
    <ul class="res grid" id="res" role="listbox"></ul>
    <p class="hint">F2 ค้นหา · ↑↓ เลือก · Enter เพิ่มลงบิล · F8 บันทึกบิล · F9 พิมพ์บิลล่าสุด · Esc ล้างบิล</p>

  <section>
    <h1>บิลขาย <small id="sync"></small></h1>
    <table><tbody id="cart"></tbody></table>

      <input id="disc" inputmode="decimal" min="0" placeholder="ส่วนลด (บาท)" aria-label="ส่วนลด">
    </div>
    <div class="tot">
      <span>รวมทั้งสิ้น</span>
      <strong id="total">0.00</strong>
    </div>
    <div class="row" id="methods">
      <button class="m on" data-m="CASH">เงินสด</button>
      <button class="m" data-m="TRANSFER">โอน</button>
      <button class="m" data-m="CREDIT">ขายเชื่อ</button>
    </div>
    <div class="row" id="credrow" style="display:none">
      <input id="party-input" list="party-list" placeholder="พิมพ์ชื่อหรือรหัสลูกค้า..." autocomplete="off" aria-label="ลูกค้า">
      <datalist id="party-list"></datalist>
    </div>
    <div class="row" id="cashrow">
      <input id="recv" inputmode="decimal" min="0" placeholder="รับเงิน" aria-label="เงินที่รับ">
      <button id="exact">พอดี</button>
      <button id="r100">ปัดร้อย</button>

      <span>เงินทอน</span>

      <summary id="failn"></summary>

      <button id="failx">ล้างรายการที่ไม่สำเร็จ</button>
    </details>
    <p class="hint"><span id="who"></span> · <a href="#" id="out">ออกจากระบบ</a> · <a href="#" id="wipe">ล้างข้อมูลในเครื่อง</a> · <a href="#" id="chdb">เปลี่ยนฐานข้อมูล</a></p>
  </section>
</main>

<!-- พื้นที่ใบเสร็จสำหรับเครื่องพิมพ์ -->
<div id="receipt-area"></div>

<script>
const DEF_URL = "https://xobdkddyvbgalrvlljha.supabase.co", DEF_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhvYmRrZGR5dmJnYWxydmxsamhhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU3MzE2NDAsImV4cCI6MjExMTMwNzY0MH0.JwIPgOW5ocpQ4Pksachy9mmm3nVjKPfKTRsmCXijr9U";   // ค่าเริ่มต้นของไฟล์ (anon key เท่านั้น ห้ามใส่ service_role)
const CFG = (() => { try { return JSON.parse(localStorage.getItem("v2:config")) || {}; } catch (e) { return {}; } })();
const SB_URL = CFG.url || DEF_URL, SB_KEY = CFG.key || DEF_KEY;   // ตั้งค่าใหม่ได้จากหน้าล็อกอิน ไม่ต้องแก้ไฟล์
const sb = supabase.createClient(SB_URL, SB_KEY);

const $ = s => document.querySelector(s);
const round2 = n => Math.round((n + Number.EPSILON) * 100) / 100;
const fmt = n => round2(+n || 0).toLocaleString("th-TH", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const uid = () => crypto.randomUUID
  ? crypto.randomUUID()
  : "10000000-1000-4000-8000-100000000000".replace(/[018]/g, c =>
      (c ^ (crypto.getRandomValues ? crypto.getRandomValues(new Uint8Array(1))[0] : Math.random() * 256) & 15 >> c / 4).toString(16)
    );

// ข้อมูลในเครื่องแยกตามโปรเจกต์ Supabase: เปลี่ยน URL/ฐานข้อมูลใหม่แล้วจะไม่เห็นสินค้าหรือบิลค้างของฐานเก่า
const NS = "v2:" + SB_URL.split("//")[1].split(".")[0] + ":";
const ls = {
  get: (k, d) => {
    try { return JSON.parse(localStorage.getItem(NS + k)) ?? d; }
    catch (e) { return d; }
  },
  set: (k, v) => {
    try { localStorage.setItem(NS + k, JSON.stringify(v)); }
    catch (e) {}
  }
};
const clearLocal = () => {
  try { Object.keys(localStorage).filter(k => k.startsWith(NS)).forEach(k => localStorage.removeItem(k)); } catch (e) {}
};
// ลบแคชรุ่นเก่าที่ยังไม่แยกตามโปรเจกต์ (บิลที่ยังไม่ส่งในรุ่นเก่าจะหายด้วย ตรวจให้ "ซิงก์แล้ว" ก่อนเปิดไฟล์นี้)
try { ["v2cat", "v2parties", "v2out", "v2fail", "v2last", "v2view"].forEach(k => localStorage.removeItem(k)); } catch (e) {}

let SK = [];
let IDX = [];
let BC = new Map();
let PARTIES = [];
let PARTY_MAP = new Map();
let cart = [];
let hits = [];
let sel = 0;
let method = "CASH";
let viewMode = ls.get("v2view", "grid");
let lastDoc = ls.get("v2last", null);
let busy = false;
let shownLimit = 60;

// แปลงพาธหรือ URL รูปภาพให้พร้อมแสดงผล (รองรับทั้ง URL เต็ม และ path ใน Supabase Storage)
function resolveImgUrl(raw) {
  if (!raw) return "";
  const str = String(raw).trim();
  if (!str) return "";
  if (/^(https?:|data:|blob:)/i.test(str)) return str;
  const cleanPath = str.replace(/^\/+/, "");
  // หากเก็บเป็น bucket/file.jpg หรือเฉพาะชื่อไฟล์ใน bucket "products"
  if (cleanPath.includes("/")) {
    const [bucket, ...rest] = cleanPath.split("/");
    return `${SB_URL}/storage/v1/object/public/${bucket}/${rest.join("/")}`;
  }
  return `${SB_URL}/storage/v1/object/public/products/${cleanPath}`;
}

// ===== แคตตาล็อก: แสดงจากแคชในเครื่องทันที แล้วรีเฟรชจากเซิร์ฟเวอร์เบื้องหลัง =====
function build(c) {
  const P = new Map(c.p.map(r => [r[0], r]));
  const U = new Map();
  BC = new Map();

  c.u.forEach(r => {
    const u = { id: r[0], sku: r[1], n: r[2], r: +r[3], p: round2(+r[4]) };
    if (!U.has(r[1])) U.set(r[1], []);
    U.get(r[1]).push(u);
    if (r[5]) BC.set(r[5], { sku: r[1], u });
  });

  SK = c.s.map(r => {
    const p = P.get(r[1]) || [0, "", "(ไม่มีกลุ่ม)", ""];
    const us = (U.get(r[0]) || []).sort((a, b) => (a.r !== 1) - (b.r !== 1) || b.r - a.r);
    // ใช้รูปจาก SKU ก่อน หากไม่มีให้ใช้รูปจาก Product หลัก
    const rawImg = r[7] || p[3] || "";
    const s = {
      id: r[0],
      code: r[2],
      name: p[2],
      v: r[3] || "",
      bc: r[4] || "",
      stock: +r[6],
      img: resolveImgUrl(rawImg),
      units: us
    };
    if (r[4]) BC.set(r[4], { sku: r[0], u: us[0] });
    return s;
  }).filter(s => s.units.length);

  const byId = new Map(SK.map(s => [s.id, s]));
  BC.forEach(x => x.sku = byId.get(x.sku));

  IDX = SK.map(s => ({
    s,
    t: (s.code + " " + s.name + " " + s.v + " " + s.bc).toLowerCase().replace(/["']/g, "")
  }));
  $("#cnt").textContent = SK.length + " รายการ";
}

async function page(t, cols) {
  let all = [], from = 0;
  for (;;) {
    const { data, error } = await sb.from(t).select(cols).order("id").range(from, from + 999);
    if (error) throw error;
    all = all.concat(data);
    if (data.length < 1000) break;
    from += 1000;
  }
  return all;
}

// ดึงตารางแบบยืดหยุ่น (ลองดึงคอลัมน์รูปภาพก่อน หากใน DB ยังไม่มีคอลัมน์รูปจะ fallback อัตโนมัติ)
async function pageWithOptionalImg(t, baseCols, imgCols = ["image_url", "image", "img", "photo_url"]) {
  for (const col of imgCols) {
    try {
      const rows = await page(t, `${baseCols},${col}`);
      return rows.map(r => ({ ...r, _img: r[col] || "" }));
    } catch (e) {
      // ลองชื่อคอลัมน์ถัดไป
    }
  }
  const rows = await page(t, baseCols);
  return rows.map(r => ({ ...r, _img: "" }));
}

async function refresh() {
  try {
    const [p, s, u, pt] = await Promise.all([
      pageWithOptionalImg("products", "id,code,name", ["image_url"]),
      page("skus", "id,product_id,code,variant,barcode,base_unit,stock").then(rows => rows.map(r => ({ ...r, _img: "" }))),
      page("units", "id,sku_id,name,ratio,price,barcode"),
      sb.from("parties").select("id,name").eq("kind", "CUSTOMER")
    ]);
    const c = {
      p: p.map(r => [r.id, r.code, r.name, r._img]),
      s: s.map(r => [r.id, r.product_id, r.code, r.variant, r.barcode, r.base_unit, r.stock, r._img]),
      u: u.map(r => [r.id, r.sku_id, r.name, r.ratio, r.price, r.barcode])
    };
    ls.set("v2cat", c);
    ls.set("v2parties", pt.data || []);
    build(c);
    parties(pt.data || []);
    search();
    render();
    return true;
  } catch (e) {
    return false;
  }
}

function parties(a) {
  PARTIES = a;
  PARTY_MAP = new Map();
  $("#party-list").innerHTML = a.map(x => {
    const label = `${x.name} (#${x.id})`;
    PARTY_MAP.set(label, x.id);
    PARTY_MAP.set(x.name.trim().toLowerCase(), x.id);
    return `<option value="${esc(label)}">`;
  }).join("");
}

function getSelectedPartyId() {
  const val = $("#party-input").value.trim();
  if (!val) return null;
  if (PARTY_MAP.has(val)) return PARTY_MAP.get(val);
  if (PARTY_MAP.has(val.toLowerCase())) return PARTY_MAP.get(val.toLowerCase());
  const match = val.match(/\(#([^)]+)\)$/);
  if (match && PARTIES.some(p => String(p.id) === match[1])) return match[1];
  return null;
}

// ===== ค้นหา / แสดงรายการสินค้าทั้งหมดและรูปภาพ =====
function setViewMode(mode) {
  viewMode = mode;
  ls.set("v2view", mode);
  $("#v-grid").classList.toggle("on", mode === "grid");
  $("#v-list").classList.toggle("on", mode === "list");
  const resEl = $("#res");
  resEl.classList.toggle("grid", mode === "grid");
  resEl.classList.toggle("list", mode === "list");
  renderRes();
}

function search() {
  const w = $("#q").value.trim().toLowerCase().replace(/["']/g, "").split(/\s+/).filter(Boolean);
  // แสดงรายการสินค้าทั้งหมด (ไม่จำกัดแค่ 10 หรือ 30 รายการ)
  hits = w.length
    ? IDX.filter(x => w.every(k => x.t.includes(k))).map(x => x.s)
    : SK;
  sel = 0;
  shownLimit = 60;
  $("#cnt").textContent = w.length
    ? `พบ ${hits.length} / ${SK.length} รายการ`
    : `ทั้งหมด ${SK.length} รายการ`;
  renderRes();
}

function renderRes() {
  if (!hits.length) {
    $("#res").innerHTML = '<li class="empty">ไม่พบสินค้า ลองพิมพ์คำสั้นลง</li>';
    return;
  }

  if (viewMode === "grid") {
    $("#res").innerHTML = hits.slice(0, shownLimit).map((s, i) => {
      const imgTag = s.img
        ? `<img src="${esc(s.img)}" alt="${esc(s.name)}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
           <span class="no-img" style="display:none">${esc(s.code || s.name)}</span>`
        : `<span class="no-img">${esc(s.code || "ไม่มีรูป")}</span>`;

      return `
        <li role="option" data-i="${i}" class="${i === sel ? "on" : ""}">
          <div>
            <div class="thumb-box">
              ${imgTag}
              <span class="stock-badge ${s.stock <= 0 ? "low" : ""}">เหลือ ${s.stock}</span>
            </div>
            <div class="p-title">${esc(s.name)}</div>
            <div class="p-meta">${esc(s.v)} ${s.v && s.code ? "·" : ""} ${esc(s.code)}</div>
          </div>
          <div class="p-price">${fmt(s.units[0].p)}</div>
        </li>`;
    }).join("");
  } else {
    $("#res").innerHTML = hits.slice(0, shownLimit).map((s, i) => {
      const miniTag = s.img
        ? `<img src="${esc(s.img)}" alt="" loading="lazy" onerror="this.replaceWith(document.createTextNode('ไม่มีรูป'))">`
        : `<span>ไม่มีรูป</span>`;

      return `
        <li role="option" data-i="${i}" class="${i === sel ? "on" : ""}">
          <div class="list-left">
            <div class="thumb-mini">${miniTag}</div>
            <div>
              <b>${esc(s.name)}</b> <small>${esc(s.v)}</small><br>
              <small>${esc(s.code)}</small>
            </div>
          </div>
          <span class="r">${fmt(s.units[0].p)}<br><small class="${s.stock <= 0 ? "low" : ""}">เหลือ ${s.stock}</small></span>
        </li>`;
    }).join("");
  }
  if (hits.length > shownLimit) {
    $("#res").insertAdjacentHTML("beforeend", `<li class="more" data-more="1">แสดงเพิ่ม (อีก ${hits.length - shownLimit} รายการ) หรือพิมพ์ค้นหาให้แคบลง</li>`);
  }
}

function add(s, u) {
  u = u || s.units[0];
  const L = cart.find(l => l.s === s && l.u === u);
  if (L) L.q = round2(L.q + 1);
  else cart.push({ s, u, q: 1 });
  $("#q").value = "";
  search();
  render();
  $("#q").focus();
}

const base = l => l.q * l.u.r;
const sub = () => round2(cart.reduce((a, l) => a + round2(l.q * l.u.p), 0));
const getDisc = () => Math.max(0, parseFloat($("#disc").value) || 0);
const total = () => round2(Math.max(0, sub() - getDisc()));

function setMethod(m) {
  method = m;
  document.querySelectorAll(".m").forEach(x => x.classList.toggle("on", x.dataset.m === m));
  calc();
}

function render() {
  $("#cart").innerHTML = cart.length
    ? cart.map((l, i) => {
        const over = base(l) > l.s.stock;
        const lineTot = round2(l.q * l.u.p);
        const thumb = l.s.img
          ? `<img class="cart-thumb" src="${esc(l.s.img)}" alt="" onerror="this.style.display='none'">`
          : "";
        return `<tr>
          <td class="n">
            <div class="cart-item-wrap">
              ${thumb}
              <div>
                <b>${esc(l.s.name)}</b> <small>${esc(l.s.v)}</small>
                ${over ? '<br><small class="low">สต็อกไม่พอ (เหลือ ' + l.s.stock + ')</small>' : ""}
              </div>
            </div>
          </td>
          <td>
            <span class="qty">
              <button data-a="dec" data-i="${i}" aria-label="ลด">−</button>
              <input value="${l.q}" data-a="set" data-i="${i}" inputmode="decimal" aria-label="จำนวน">
              <button data-a="inc" data-i="${i}" aria-label="เพิ่ม">+</button>
            </span>
          </td>
          <td>
            <select data-a="unit" data-i="${i}" aria-label="หน่วย">
              ${l.s.units.map((u, j) => `<option value="${j}" ${u === l.u ? "selected" : ""}>${esc(u.n)}</option>`).join("")}
            </select>
          </td>
          <td class="r">${fmt(lineTot)}</td>
          <td><button class="x" data-a="del" data-i="${i}" aria-label="ลบ">×</button></td>
        </tr>`;
      }).join("")
    : '<tr><td class="empty">ยังไม่มีสินค้าในบิล สแกนหรือคลิกเลือกสินค้าด้านซ้าย</td></tr>';

  $("#total").textContent = fmt(total());
  calc();
}

function calc() {
  const t = total();
  const rawRecv = parseFloat($("#recv").value);
  const r = Math.max(0, isNaN(rawRecv) ? 0 : rawRecv);
  const partyId = getSelectedPartyId();

  $("#cashrow").style.display = method === "CASH" ? "flex" : "none";
  $("#credrow").style.display = method === "CREDIT" ? "flex" : "none";
  $("#chg").textContent = fmt(Math.max(0, round2(r - t)));

  $("#pay").disabled =
    !cart.length ||
    (method === "CASH" && $("#recv").value !== "" && r < t) ||
    (method === "CREDIT" && !partyId);

  $("#print-last").disabled = !lastDoc;

  const n = ls.get("v2out", []).length;
  $("#sync").textContent = n ? n + " บิลรอส่ง" : "ซิงก์แล้ว";
}

function resetCart(askConfirm = false) {
  if (askConfirm && cart.length > 0) {
    if (!confirm("ยืนยันการล้างรายการสินค้าในบิล?")) return;
  }
  cart = [];
  $("#recv").value = "";
  $("#disc").value = "";
  $("#party-input").value = "";
  setMethod("CASH");
  render();
  $("#q").value = "";
  search();
  $("#q").focus();
}

// ===== บันทึกบิลลงคิวในเครื่องทันที แล้วส่ง post_doc เบื้องหลัง =====
function pay() {
  if ($("#pay").disabled) return;
  const t0 = performance.now();
  const sTot = sub();
  const disc = getDisc();
  const tot = total();
  const partyId = method === "CREDIT" ? getSelectedPartyId() : null;
  const partyObj = partyId ? PARTIES.find(p => String(p.id) === String(partyId)) : null;
  const recvVal = method === "CASH" ? (parseFloat($("#recv").value) || tot) : tot;
  const chgVal = method === "CASH" ? Math.max(0, round2(recvVal - tot)) : 0;

  const doc = {
    cid: uid(),
    pm: method,
    party: partyId,
    partyName: partyObj ? partyObj.name : "",
    sub: sTot,
    disc: disc,
    paid: method === "CREDIT" ? 0 : null,
    recv: recvVal,
    chg: chgVal,
    tot: tot,
    at: new Date().toLocaleString("th-TH"),
    items: cart.map(l => ({
      name: l.s.name,
      variant: l.s.v,
      unit: l.u.n,
      qty: l.q,
      price: l.u.p,
      amount: round2(l.q * l.u.p)
    })),
    lines: cart.map(l => ({ sku_id: l.s.id, unit_id: l.u.id, qty: l.q }))
  };

  cart.forEach(l => l.s.stock = round2(l.s.stock - base(l)));
  const o = ls.get("v2out", []);
  o.push(doc);
  ls.set("v2out", o);

  lastDoc = doc;
  ls.set("v2last", doc);

  resetCart(false);
  $("#msg").className = "";
  $("#msg").textContent = `บันทึกบิล ${fmt(tot)} บาท ใน ${Math.round(performance.now() - t0)} มิลลิวินาที`;
  flush();
}

function printReceipt(doc = lastDoc) {
  if (!doc) return;
  const pmLabel = { CASH: "เงินสด", TRANSFER: "เงินโอน", CREDIT: "ขายเชื่อ" }[doc.pm] || doc.pm;
  const itemsHtml = (doc.items || []).map(it => `
    <tr>
      <td>${esc(it.name)} ${esc(it.variant)}<br><small>${it.qty} ${esc(it.unit)} × ${fmt(it.price)}</small></td>
      <td style="text-align:right;white-space:nowrap">${fmt(it.amount)}</td>
    </tr>
  `).join("");

  $("#receipt-area").innerHTML = `
    <h2>ใบเสร็จรับเงิน / บิลเงินสด</h2>
    <div class="rc-meta">
      วันที่: ${esc(doc.at)}<br>
      เลขที่อ้างอิง: ${esc(doc.docNo || doc.cid.slice(0, 8).toUpperCase())}<br>
      ชำระโดย: ${esc(pmLabel)}${doc.partyName ? " (" + esc(doc.partyName) + ")" : ""}
    </div>
    <table><tbody>${itemsHtml}</tbody></table>
    <div class="rc-line"></div>
    ${doc.disc > 0 ? `
      <div class="rc-row"><span>รวมเป็นเงิน</span><span>${fmt(doc.sub)}</span></div>
      <div class="rc-row"><span>ส่วนลด</span><span>-${fmt(doc.disc)}</span></div>
    ` : ""}
    <div class="rc-tot"><span>ยอดสุทธิ</span><span>${fmt(doc.tot)}</span></div>
    ${doc.pm === "CASH" ? `
      <div class="rc-row"><span>รับเงิน</span><span>${fmt(doc.recv)}</span></div>
      <div class="rc-row"><span>เงินทอน</span><span>${fmt(doc.chg)}</span></div>
    ` : ""}
    <div class="rc-foot">ขอบคุณที่ใช้บริการ</div>
  `;
  window.print();
}

async function flush() {
  if (busy) return;
  busy = true;
  try {
    for (;;) {
      const o = ls.get("v2out", []);
      if (!o.length) break;
      const d = o[0];

      const { data, error } = await sb.rpc("post_doc", {
        p_client_id: d.cid,
        p_type: "SALE",
        p_party: d.party,
        p_discount: d.disc,
        p_pay_method: d.pm,
        p_paid: d.paid,
        p_lines: d.lines
      });

      const isTransient = error && (
        (!error.code && !error.hint && /fetch|network|Failed|timeout|abort/i.test(error.message)) ||
        [500, 502, 503, 504].includes(error.status)
      );
      const isAuth = error && (/JWT|expired|not authenticated|PGRST30\d/i.test(error.message || "") || /^PGRST30\d$/.test(error.code || ""));
      if (isAuth) {
        $("#msg").className = "err";
        $("#msg").textContent = "เซสชันหมดอายุ ออกจากระบบแล้วเข้าสู่ระบบใหม่ (บิลยังเก็บอยู่ในเครื่อง ไม่หาย)";
        break;
      }
      if (isTransient) break;

      const rest = ls.get("v2out", []).slice(1);
      ls.set("v2out", rest);
      if (!error && data && lastDoc && lastDoc.cid === d.cid) { lastDoc.docNo = data.doc_no; ls.set("v2last", lastDoc); }

      if (error) {
        const f = ls.get("v2fail", []);
        f.push({ at: d.at, tot: d.tot, err: error.message });
        ls.set("v2fail", f);
        $("#msg").className = "err";
        $("#msg").textContent = "มีบิลที่เซิร์ฟเวอร์ปฏิเสธ: " + error.message;
      }
    }
  } finally {
    busy = false;
    calc();
    showFail();
  }
}

function showFail() {
  const f = ls.get("v2fail", []);
  $("#fail").style.display = f.length ? "block" : "none";
  $("#failn").textContent = f.length + " บิลไม่สำเร็จ (ต้องทำรายการใหม่)";
  $("#faill").innerHTML = f.map(x => `<li>${esc(x.at)} · ${fmt(x.tot)} บาท — ${esc(x.err)}</li>`).join("");
}

// ===== เหตุการณ์ (Events) =====
$("#v-grid").onclick = () => setViewMode("grid");
$("#v-list").onclick = () => setViewMode("list");

$("#q").addEventListener("input", search);
$("#q").addEventListener("keydown", e => {
  if (e.key === "ArrowDown") {
    sel = Math.min(sel + 1, hits.length - 1);
    if (sel >= shownLimit) shownLimit += 60;
    renderRes();
    const activeEl = $("#res li.on");
    if (activeEl) activeEl.scrollIntoView({ block: "nearest" });
    e.preventDefault();
  } else if (e.key === "ArrowUp") {
    sel = Math.max(sel - 1, 0);
    renderRes();
    const activeEl = $("#res li.on");
    if (activeEl) activeEl.scrollIntoView({ block: "nearest" });
    e.preventDefault();
  } else if (e.key === "Enter") {
    const v = e.target.value.trim();
    const b = BC.get(v);
    if (b && b.sku) {
      add(b.sku, b.u);
    } else {
      const c = SK.find(s => s.code.toLowerCase() === v.toLowerCase());
      if (c) add(c);
      else if (hits[sel] && v) add(hits[sel]);
    }
  }
});

$("#res").addEventListener("click", e => {
  if (e.target.closest("li[data-more]")) { shownLimit += 60; renderRes(); return; }
  const li = e.target.closest("li[data-i]");
  if (li) add(hits[+li.dataset.i]);
});

$("#cart").addEventListener("click", e => {
  const b = e.target.closest("button[data-a]");
  if (!b) return;
  const i = +b.dataset.i;
  const l = cart[i];
  if (b.dataset.a === "inc") l.q = round2(l.q + 1);
  if (b.dataset.a === "dec") l.q = Math.max(1, round2(l.q - 1));
  if (b.dataset.a === "del") cart.splice(i, 1);
  render();
});

$("#cart").addEventListener("change", e => {
  const l = cart[+e.target.dataset.i];
  if (!l) return;
  if (e.target.dataset.a === "unit") l.u = l.s.units[+e.target.value];
  if (e.target.dataset.a === "set") l.q = Math.max(0.01, round2(parseFloat(e.target.value) || 1));
  render();
});

$("#methods").addEventListener("click", e => {
  const b = e.target.closest(".m");
  if (!b) return;
  setMethod(b.dataset.m);
});

["recv", "disc", "party-input"].forEach(id => {
  $("#" + id).addEventListener("input", () => {
    $("#total").textContent = fmt(total());
    calc();
  });
});

["recv", "disc"].forEach(id => {
  $("#" + id).addEventListener("blur", () => {
    const val = parseFloat($("#" + id).value);
    if (!isNaN(val) && val < 0) {
      $("#" + id).value = "0";
      $("#total").textContent = fmt(total());
      calc();
    }
  });
});

$("#exact").onclick = () => { $("#recv").value = total(); calc(); };
$("#r100").onclick = () => { $("#recv").value = Math.ceil(total() / 100) * 100; calc(); };
$("#pay").onclick = pay;
$("#print-last").onclick = () => printReceipt(lastDoc);
$("#clear-btn").onclick = () => resetCart(true);
$("#failx").onclick = () => { ls.set("v2fail", []); showFail(); };

document.addEventListener("keydown", e => {
  if (e.key === "F2") {
    e.preventDefault();
    $("#q").focus();
  }
  if (e.key === "F8") {
    e.preventDefault();
    pay();
  }
  if (e.key === "F9") {
    e.preventDefault();
    printReceipt(lastDoc);
  }
  if (e.key === "Escape") {
    e.preventDefault();
    resetCart(true);
  }
});

window.addEventListener("online", flush);

// ===== เข้าสู่ระบบ =====
async function start(user) {
  $("#lg").style.display = "none";
  $("#app").style.display = "grid";
  $("#who").textContent = user.email;
  setViewMode(viewMode);

  const c = ls.get("v2cat", null);
  if (c) {
    build(c);
    parties(ls.get("v2parties", []));
    search();
    render();
  }

  const ok = await refresh();
  if (!ok && !c) {
    $("#msg").className = "err";
    $("#msg").textContent = "โหลดสินค้าไม่ได้ ตรวจอินเทอร์เน็ตแล้วเปิดใหม่";
  } else if (!ok) {
    $("#msg").textContent = "ออฟไลน์ ใช้ข้อมูลสินค้าที่บันทึกไว้ในเครื่อง";
  }

  showFail();
  flush();
  $("#q").focus();
}

  if (data.session) start(data.session.user);
});

// ===== เปลี่ยนฐานข้อมูล: บันทึกในเครื่อง ไม่ต้องแก้ไฟล์ (ข้อมูลที่แคชไว้แยกตามโปรเจกต์อยู่แล้ว) =====
(function () {
  const q = s => document.querySelector(s), ref = SB_URL.split("//")[1].split(".")[0], info = q("#cinfo");
  if (info) info.textContent = "ตอนนี้เชื่อมต่อ: " + ref + (CFG.url ? " (ตั้งในเครื่อง)" : " (ค่าเริ่มต้นของไฟล์)");
  const role = k => { try { return JSON.parse(atob(k.split(".")[1].replace(/-/g, "+").replace(/_/g, "/"))).role; } catch (e) { return null; } };
  const bad = m => { info.textContent = m; info.style.color = "var(--bad)"; };
  if (q("#csave")) q("#csave").onclick = () => {
    const u = q("#cu").value.trim().replace(/\/+$/, ""), k = q("#ck").value.trim();
    if (!/^https:\/\/[a-z0-9]+\.supabase\.co$/.test(u)) return bad("URL ต้องเป็นรูปแบบ https://xxxx.supabase.co");
    if (/^sb_secret_/.test(k) || role(k) === "service_role") return bad("นี่คือคีย์ลับ (service_role/secret) ห้ามใช้ในหน้าเว็บ ใช้ anon หรือ publishable key เท่านั้น");
    if (!/^sb_publishable_/.test(k) && role(k) !== "anon") return bad("คีย์ไม่ถูกต้อง ต้องเป็น anon หรือ publishable key");
    try { localStorage.setItem("v2:config", JSON.stringify({ url: u, key: k })); } catch (e) { return bad("บันทึกในเครื่องไม่ได้"); }
    location.hash = ""; location.reload();
  };
  if (q("#creset")) q("#creset").onclick = () => { try { localStorage.removeItem("v2:config"); } catch (e) {} location.hash = ""; location.reload(); };
  const ch = q("#chdb");
  if (ch) ch.onclick = async e => { if (e && e.preventDefault) e.preventDefault(); try { await sb.auth.signOut(); } catch (x) {} location.hash = "#db"; location.reload(); };
  if (location.hash === "#db" && q("#cfg")) q("#cfg").open = true;
})();
</script>
</body>
