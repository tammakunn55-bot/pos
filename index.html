<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SMART-POS v2 · ขาย (Pro)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root {
  --bg: #eef0f2;
  --panel: #fff;
  --ink: #1d2329;
  --mute: #66707a;
  --line: #d5d9de;
  --tag: #f2b705;
  --tagink: #2a2100;
  --ok: #1b7f4b;
  --bad: #b3261e;
  --info: #0b57d0;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15191d;
    --panel: #1e2429;
    --ink: #e8ecef;
    --mute: #98a3ad;
    --line: #333c44;
    --ok: #4cc38a;
    --bad: #ff8a80;
    --info: #6ea8fe;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.4 Sarabun, system-ui, "Noto Sans Thai", sans-serif;
}
main {
  max-width: 1320px;
  margin: 0 auto;
  padding: 12px;
  display: grid;
  gap: 12px;
  grid-template-columns: 1fr;
}
@media (min-width: 880px) {
  main { grid-template-columns: 1.25fr 1fr; }
}
section {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 12px;
  min-width: 0;
}
h1 {
  font-size: 18px;
  margin: 0 0 8px;
  display: flex;
  justify-content: space-between;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
}
h1 small {
  font-weight: 400;
  color: var(--mute);
  font-size: 13px;
}
input, select, button {
  font: inherit;
  color: inherit;
}
#q, .lg input {
  width: 100%;
  padding: 11px 12px;
  font-size: 18px;
  border: 2px solid var(--ink);
  border-radius: 8px;
  background: var(--bg);
  margin-top: 4px;
}
:focus-visible {
  outline: 3px solid var(--tag);
  outline-offset: 1px;
}

/* ปุ่มควบคุมด้านบน (Grid/List, เสียง, สรุปยอด) */
.view-ctrl {
  display: inline-flex;
  gap: 4px;
  align-items: center;
}
.vbtn {
  padding: 4px 9px;
  font-size: 13px;
  border: 1px solid var(--line);
  background: var(--bg);
  border-radius: 6px;
  cursor: pointer;
}
.vbtn.on {
  background: var(--ink);
  color: var(--bg);
  border-color: var(--ink);
  font-weight: 600;
}

/* แถบหมวดหมู่สินค้า (Category Tabs) */
.cat-bar {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 8px 0 2px;
  scrollbar-width: thin;
}
.cat-btn {
  flex-shrink: 0;
  padding: 5px 12px;
  font-size: 13px;
  border-radius: 20px;
  border: 1px solid var(--line);
  background: var(--bg);
  cursor: pointer;
  white-space: nowrap;
}
.cat-btn.on {
  background: var(--tag);
  color: var(--tagink);
  border-color: var(--tag);
  font-weight: 700;
}

/* รายการสินค้า (รองรับทั้งแบบตารางการ์ดมีรูป และแบบรายการแถว) */
.res {
  list-style: none;
  margin: 8px 0 0;
  padding: 0;
  max-height: 60vh;
  overflow-y: auto;
}
.res.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(142px, 1fr));
  gap: 8px;
}
.res.grid li {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 8px;
  background: var(--bg);
  cursor: pointer;
  transition: transform .08s ease;
}
.res.grid li:active {
  transform: scale(0.98);
}
.res.grid li.on, .res.grid li:hover {
  border-color: var(--tag);
  background: color-mix(in srgb, var(--tag) 18%, var(--bg));
}
.res.grid .thumb-box {
  width: 100%;
  aspect-ratio: 1 / 1;
  border-radius: 6px;
  overflow: hidden;
  background: var(--panel);
  border: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 6px;
  position: relative;
}
.res.grid .thumb-box img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.res.grid .no-img {
  font-size: 12px;
  color: var(--mute);
  text-align: center;
  padding: 4px;
  word-break: break-word;
}
.res.grid .stock-badge {
  position: absolute;
  top: 4px;
  right: 4px;
  font-size: 11px;
  font-weight: 600;
  padding: 1px 6px;
  border-radius: 4px;
  background: rgba(0, 0, 0, 0.72);
  color: #fff;
}
.res.grid .stock-badge.low {
  background: var(--bad);
}
.res.grid .p-title {
  font-size: 14px;
  font-weight: 700;
  line-height: 1.25;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.res.grid .p-meta {
  font-size: 12px;
  color: var(--mute);
  margin-top: 2px;
}
.res.grid .p-price {
  font-size: 16px;
  font-weight: 700;
  color: var(--ok);
  margin-top: 6px;
  text-align: right;
}

/* มุมมองแบบรายการ (List) */
.res.list li {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 8px;
  border-bottom: 1px solid var(--line);
  cursor: pointer;
}
.res.list li.on, .res.list li:hover {
  background: color-mix(in srgb, var(--tag) 25%, transparent);
}
.res.list .list-left {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
  flex: 1;
}
.res.list .thumb-mini {
  width: 48px;
  height: 48px;
  flex-shrink: 0;
  border-radius: 6px;
  overflow: hidden;
  border: 1px solid var(--line);
  background: var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  color: var(--mute);
}
.res.list .thumb-mini img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.res small, .hint { color: var(--mute); }
.low { color: var(--bad); }
.hint { font-size: 13px; margin: 8px 0 0; }

/* ตะกร้าสินค้า */
.cart-wrap {
  max-height: 36vh;
  overflow-y: auto;
}
table { width: 100%; border-collapse: collapse; }
td {
  padding: 7px 4px;
  border-bottom: 1px solid var(--line);
  vertical-align: middle;
}
td.n { width: 100%; }
td.r { text-align: right; white-space: nowrap; }
.cart-item-wrap {
  display: flex;
  align-items: center;
  gap: 8px;
}
.cart-thumb {
  width: 36px;
  height: 36px;
  border-radius: 5px;
  object-fit: cover;
  border: 1px solid var(--line);
  flex-shrink: 0;
  background: var(--bg);
}
.line-disc-btn {
  font-size: 11px;
  padding: 1px 6px;
  border: 1px dashed var(--line);
  border-radius: 4px;
  background: var(--bg);
  color: var(--info);
  cursor: pointer;
  margin-top: 2px;
  display: inline-block;
}
.qty {
  display: inline-flex;
  align-items: center;
  gap: 3px;
}
.qty button {
  width: 28px;
  height: 28px;
  border: 1px solid var(--line);
  background: var(--bg);
  border-radius: 6px;
  cursor: pointer;
}
.qty input {
  width: 48px;
  text-align: center;
  padding: 4px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--bg);
}
select {
  padding: 5px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--bg);
  max-width: 90px;
}
.x {
  border: 0;
  background: none;
  color: var(--bad);
  cursor: pointer;
  font-size: 18px;
}

.tot {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin: 8px 0 4px;
}
.tot strong { font-size: 32px; }
.row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin: 6px 0;
}
.row button, .row input, .row select {
  flex: 1;
  min-width: 72px;
  padding: 9px 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--bg);
  cursor: pointer;
}
.row input {
  cursor: text;
  text-align: right;
}
#party-input {
  text-align: left !important;
}
.pay, .lg button {
  width: 100%;
  padding: 13px;
  font-size: 20px;
  font-weight: 700;
  background: var(--tag);
  color: var(--tagink);
  border: 0;
  border-radius: 10px;
  cursor: pointer;
  margin-top: 6px;
}
.pay.muted {
  opacity: .55;
}
.lg button:disabled {
  opacity: .4;
  cursor: not-allowed;
}
.m.on {
  background: var(--ink) !important;
  color: var(--bg);
}
#msg {
  min-height: 22px;
  margin-top: 8px;
  color: var(--ok);
  font-weight: 600;
  font-size: 14px;
}
#msg.err { color: var(--bad); }
.empty {
  color: var(--mute);
  padding: 18px 4px;
  text-align: center;
  grid-column: 1 / -1;
}

/* รายการบิลที่ส่งไม่สำเร็จ (Failed Bills + Retry) */
#fail {
  display: none;
  margin-top: 8px;
  padding: 8px;
  border: 1px solid var(--bad);
  border-radius: 8px;
  background: color-mix(in srgb, var(--bad) 8%, var(--panel));
}
#fail summary {
  color: var(--bad);
  font-weight: 700;
  cursor: pointer;
}
#fail ul {
  padding-left: 18px;
  margin: 6px 0;
  font-size: 13px;
}
#fail li {
  margin: 6px 0;
}
.fail-actions {
  display: flex;
  gap: 6px;
  margin-top: 6px;
}

.lg {
  max-width: 380px;
  margin: 12vh auto;
  padding: 0 14px;
}
.act-bar {
  display: flex;
  gap: 6px;
  margin-top: 8px;
  flex-wrap: wrap;
}
.btn-sub {
  flex: 1;
  min-width: 90px;
  padding: 8px 10px;
  font-size: 13px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--bg);
  cursor: pointer;
  white-space: nowrap;
}
.btn-sub:disabled {
  opacity: .4;
  cursor: not-allowed;
}
.badge-pill {
  background: var(--tag);
  color: var(--tagink);
  font-weight: 700;
  padding: 1px 6px;
  border-radius: 10px;
  font-size: 11px;
  margin-left: 4px;
}

/* Modal หน้าต่างป๊อปอัป (พักบิล / สรุปยอดกะ / ส่วนลดรายรายการ) */
dialog {
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--panel);
  color: var(--ink);
  padding: 16px;
  max-width: 480px;
  width: 92%;
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.28);
}
dialog::backdrop {
  background: rgba(0, 0, 0, 0.5);
}
.dlg-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
  border-bottom: 1px solid var(--line);
  padding-bottom: 8px;
}
.dlg-head h2 {
  margin: 0;
  font-size: 18px;
}
.dlg-close {
  border: 0;
  background: none;
  font-size: 22px;
  cursor: pointer;
  color: var(--mute);
}
.hold-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
  margin-bottom: 8px;
  background: var(--bg);
}
.shift-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 12px;
}
.shift-card {
  padding: 10px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--bg);
}
.shift-card small {
  display: block;
  color: var(--mute);
}
.shift-card strong {
  font-size: 20px;
}

/* ส่วนสำหรับพิมพ์ใบเสร็จ (แสดงเฉพาะตอนสั่งพิมพ์) */
#receipt-area { display: none; }
@media print {
  body {
    background: #fff !important;
    color: #000 !important;
    font-family: "Sarabun", monospace, sans-serif;
  }
  main, .lg, dialog { display: none !important; }
  #receipt-area {
    display: block !important;
    width: 100%;
    max-width: 80mm;
    margin: 0 auto;
    padding: 4px;
    font-size: 13px;
    line-height: 1.35;
  }
  #receipt-area h2 {
    text-align: center;
    font-size: 16px;
    margin: 0 0 4px;
  }
  #receipt-area .rc-meta {
    font-size: 11px;
    text-align: center;
    margin-bottom: 8px;
    border-bottom: 1px dashed #000;
    padding-bottom: 6px;
  }
  #receipt-area table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 6px;
  }
  #receipt-area td {
    padding: 3px 0;
    border: none;
    vertical-align: top;
  }
  #receipt-area .rc-line {
    border-top: 1px dashed #000;
    margin: 6px 0;
  }
  #receipt-area .rc-tot {
    display: flex;
    justify-content: space-between;
    font-weight: 700;
    font-size: 15px;
  }
  #receipt-area .rc-row {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
  }
  #receipt-area .rc-foot {
    text-align: center;
    font-size: 11px;
    margin-top: 10px;
  }
}
</style>
</head>
<body>

<div class="lg" id="lg">
  <section>
    <h1>SMART-POS v2 <small>Pro Edition</small></h1>
    <input id="em" type="email" autocomplete="username" placeholder="อีเมล" aria-label="อีเมล">
    <input id="pw" type="password" autocomplete="current-password" placeholder="รหัสผ่าน" aria-label="รหัสผ่าน">
    <button id="go">เข้าสู่ระบบ</button>
    <div id="lerr" class="hint low" role="alert"></div>
  </section>
</div>

<main id="app" style="display:none">
  <section>
    <h1>
      <span>รายการสินค้า <small id="cnt"></small></span>
      <span class="view-ctrl">
        <button type="button" class="vbtn on" id="sound-btn" title="เปิด/ปิดเสียงแจ้งเตือน">🔊 เสียง</button>
        <button type="button" class="vbtn on" id="v-grid" title="แสดงแบบตารางรูปภาพ">รูปภาพ</button>
        <button type="button" class="vbtn" id="v-list" title="แสดงแบบรายการ">รายการ</button>
      </span>
    </h1>
    <input id="q" type="search" autocomplete="off" placeholder="พิมพ์ชื่อ รหัส หรือสแกนบาร์โค้ด แล้วกด Enter" aria-label="ค้นหาสินค้า">
    <div class="cat-bar" id="cat-bar"></div>
    <ul class="res grid" id="res" role="listbox"></ul>
    <p class="hint">F2 ค้นหา · ↑↓ เลือก · Enter เพิ่ม · F4 พักบิล · F8 บันทึก · F9 พิมพ์ล่าสุด · Esc ล้าง</p>
  </section>

  <section>
    <h1>
      <span>บิลขาย <small id="sync"></small></span>
      <span class="view-ctrl">
        <button type="button" class="vbtn" id="shift-btn" title="สรุปยอดขายกะ">📊 สรุปกะ</button>
        <button type="button" class="vbtn" id="refresh-btn" title="อัปเดตข้อมูลสินค้าและสต็อก">🔄 ซิงก์</button>
      </span>
    </h1>
    <div class="cart-wrap">
      <table><tbody id="cart"></tbody></table>
    </div>
    <div class="row">
      <input id="disc" placeholder="ส่วนลดท้ายบิล (เช่น 20 หรือ 10%)" aria-label="ส่วนลด">
    </div>
    <div class="tot">
      <span>รวมทั้งสิ้น</span>
      <strong id="total">0.00</strong>
    </div>
    <div class="row" id="methods">
      <button class="m on" data-m="CASH">เงินสด</button>
      <button class="m" data-m="TRANSFER">โอน</button>
      <button class="m" data-m="CREDIT">ขายเชื่อ</button>
    </div>
    <div class="row" id="credrow" style="display:none">
      <input id="party-input" list="party-list" placeholder="พิมพ์ชื่อหรือรหัสลูกค้า..." autocomplete="off" aria-label="ลูกค้า">
      <datalist id="party-list"></datalist>
    </div>
    <div class="row" id="cashrow">
      <input id="recv" inputmode="decimal" min="0" placeholder="รับเงิน (เว้นว่าง = รับพอดี)" aria-label="เงินที่รับ">
      <button id="exact">พอดี</button>
      <button id="r100">ปัดร้อย</button>
    </div>
    <div class="tot">
      <span>เงินทอน</span>
      <strong id="chg" style="font-size:22px">0.00</strong>
    </div>
    <button class="pay muted" id="pay">บันทึกบิล (F8)</button>
    <div class="act-bar">
      <button class="btn-sub" id="hold-btn" title="พักบิลปัจจุบัน (F4)">⏸ พักบิล</button>
      <button class="btn-sub" id="recall-btn" title="เรียกบิลที่พักไว้">📂 บิลพัก<span class="badge-pill" id="hold-cnt">0</span></button>
      <button class="btn-sub" id="print-last" disabled>🖨️ พิมพ์ล่าสุด (F9)</button>
      <button class="btn-sub" id="clear-btn">🗑️ ล้าง (Esc)</button>
    </div>
    <div id="msg" role="status"></div>
    <details id="fail">
      <summary id="failn"></summary>
      <ul id="faill"></ul>
      <div class="fail-actions">
        <button class="btn-sub" id="fail-retry">🔄 ลองส่งใหม่ทั้งหมด</button>
        <button class="btn-sub" id="failx">🗑️ ล้างรายการ</button>
      </div>
    </details>
    <p class="hint"><span id="who"></span> · <a href="#" id="out">ออกจากระบบ</a></p>
  </section>
</main>

<!-- Modal: จัดการบิลที่พักไว้ (Hold Bills) -->
<dialog id="dlg-hold">
  <div class="dlg-head">
    <h2>📂 รายการบิลที่พักไว้</h2>
    <button class="dlg-close" data-close="dlg-hold">×</button>
  </div>
  <div id="hold-list"></div>
</dialog>

<!-- Modal: สรุปยอดขายกะ (Shift Summary) -->
<dialog id="dlg-shift">
  <div class="dlg-head">
    <h2>📊 สรุปยอดขายรอบปัจจุบัน</h2>
    <button class="dlg-close" data-close="dlg-shift">×</button>
  </div>
  <div id="shift-content"></div>
  <div class="act-bar" style="margin-top:12px">
    <button class="btn-sub" id="shift-print">🖨️ พิมพ์ใบสรุปกะ</button>
    <button class="btn-sub" id="shift-reset" style="color:var(--bad)">🔄 เริ่มรอบกะใหม่</button>
  </div>
</dialog>

<!-- Modal: แก้ไขส่วนลด / จำนวนรายรายการ -->
<dialog id="dlg-line">
  <div class="dlg-head">
    <h2 id="dlg-line-title">แก้ไขรายการสินค้า</h2>
    <button class="dlg-close" data-close="dlg-line">×</button>
  </div>
  <div style="display:flex;flex-direction:column;gap:10px">
    <label>จำนวนสินค้า:
      <input id="line-qty-input" type="number" step="any" min="0" style="width:100%;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg)">
    </label>
    <label>ส่วนลดเฉพาะรายการนี้ (บาท หรือ % เช่น 10%):

// ===== 1. ระบบจัดเก็บข้อมูล IndexedDB + Memory Cache (แทนที่ localStorage เพื่อป้องกัน Quota เต็ม) =====
const store = (() => {
  const mem = new Map();
  let dbPromise = null;

  function getDB() {
    if (dbPromise) return dbPromise;
    dbPromise = new Promise((resolve, reject) => {
      if (!window.indexedDB) return reject(new Error("No IndexedDB"));
      const req = indexedDB.open("smart_pos_v2_db", 1);
      req.onupgradeneeded = () => req.result.createObjectStore("kv");
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
    return dbPromise;
  }

  return {
    async init(keys) {
      try {
        const db = await getDB();
        await Promise.all(keys.map(k => new Promise(res => {
          const tx = db.transaction("kv", "readonly");
          const r = tx.objectStore("kv").get(k);
          r.onsuccess = () => {
            if (r.result !== undefined) mem.set(k, r.result);
            else {
              // ย้ายข้อมูลเก่าจาก localStorage (Migration) ถ้ามี
              try {
                const legacy = localStorage.getItem(k);
                if (legacy !== null) {
                  const parsed = JSON.parse(legacy);
                  mem.set(k, parsed);
                  this.set(k, parsed);
                  localStorage.removeItem(k);
                }
              } catch (e) {}
            }
            res();
          };
          r.onerror = () => res();
        })));
      } catch (e) {
        // Fallback กรณีเปิดในโหมดที่ปิด IndexedDB
        keys.forEach(k => {
          try {
            const v = localStorage.getItem(k);
            if (v !== null) mem.set(k, JSON.parse(v));
          } catch (err) {}
        });
      }
    },
    get(k, d) {
      return mem.has(k) ? mem.get(k) : d;
    },
    set(k, v) {
      mem.set(k, v);
      getDB().then(db => {
        const tx = db.transaction("kv", "readwrite");
        tx.objectStore("kv").put(v, k);
      }).catch(() => {
        try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {}
      });
    }
  };
})();

// ===== 2. ระบบเสียงแจ้งเตือน (Web Audio API - ไม่ต้องพึ่งไฟล์เสียงภายนอก) =====
let soundEnabled = true;
let audioCtx = null;
function beep(type = "ok") {
  if (!soundEnabled) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    const now = audioCtx.currentTime;

    if (type === "ok") {
      osc.type = "sine";
      osc.frequency.setValueAtTime(1046.5, now); // C6
      gain.gain.setValueAtTime(0.08, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
      osc.start(now);
      osc.stop(now + 0.08);
    } else if (type === "pay") {
      osc.type = "triangle";
      osc.frequency.setValueAtTime(880, now);
      osc.frequency.setValueAtTime(1318.5, now + 0.08);
      gain.gain.setValueAtTime(0.1, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
      osc.start(now);
      osc.stop(now + 0.22);
    } else {
      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(180, now);
      gain.gain.setValueAtTime(0.12, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
      osc.start(now);
      osc.stop(now + 0.22);
    }
  } catch (e) {}
}

function resolveImgUrl(raw) {
  if (!raw) return "";
  const str = String(raw).trim();
  if (!str) return "";
  if (/^(https?:|data:|blob:)/i.test(str)) return str;
  const cleanPath = str.replace(/^\/+/, "");
  if (cleanPath.includes("/")) {
    const [bucket, ...rest] = cleanPath.split("/");
    return `${SB_URL}/storage/v1/object/public/${bucket}/${rest.join("/")}`;
  }
  return `${SB_URL}/storage/v1/object/public/products/${cleanPath}`;
}

function build(c) {
  const P = new Map(c.p.map(r => [r[0], r]));
  const U = new Map();
  BC = new Map();
  const catSet = new Set();

  c.u.forEach(r => {
    const u = { id: r[0], sku: r[1], n: r[2], r: +r[3], p: round2(+r[4]) };
    if (!U.has(r[1])) U.set(r[1], []);
    U.get(r[1]).push(u);
    if (r[5]) BC.set(r[5], { sku: r[1], u });
  });

  SK = c.s.map(r => {
    const p = P.get(r[1]) || [0, "", "(ไม่มีกลุ่ม)", "", ""];
    const us = (U.get(r[0]) || []).sort((a, b) => (a.r !== 1) - (b.r !== 1) || b.r - a.r);
    const rawImg = r[7] || p[3] || "";
    const catName = (p[4] || "").trim() || "ทั่วไป";
    catSet.add(catName);

    const s = {
      id: r[0],
      code: r[2],
      name: p[2],
      cat: catName,
      v: r[3] || "",
      bc: r[4] || "",
      stock: +r[6],
      img: resolveImgUrl(rawImg),
      units: us
    };
    if (r[4]) BC.set(r[4], { sku: r[0], u: us[0] });
    return s;
  }).filter(s => s.units.length);

  const byId = new Map(SK.map(s => [s.id, s]));
  BC.forEach(x => x.sku = byId.get(x.sku));

  CATEGORIES = Array.from(catSet).sort((a, b) => a.localeCompare(b, "th"));

  IDX = SK.map(s => ({
    s,
    t: (s.code + " " + s.name + " " + s.v + " " + s.bc + " " + s.cat).toLowerCase().replace(/["']/g, "")

async function page(t, cols) {
  let all = [], from = 0;
  for (;;) {
    const { data, error } = await sb.from(t).select(cols).order("id").range(from, from + 999);
    if (error) throw error;
    all = all.concat(data);
    if (data.length < 1000) break;
    from += 1000;
  }
  return all;
}

async function pageProductsSmart() {
  const imgCols = ["image_url", "image", "img", "photo_url"];
  const catCols = ["category", "category_name", "group_name", "type"];
  let foundImg = "";
  let foundCat = "";

  for (const col of imgCols) {
    try {
      await sb.from("products").select(col).limit(1);
      foundImg = col;
      break;
    } catch (e) {}
  }
  for (const col of catCols) {
    try {
      await sb.from("products").select(col).limit(1);
      foundCat = col;
      break;
    } catch (e) {}
  }

  const cols = ["id", "code", "name", foundImg, foundCat].filter(Boolean).join(",");
  const rows = await page("products", cols);
  return rows.map(r => ({
    ...r,
    _img: foundImg ? (r[foundImg] || "") : "",
    _cat: foundCat ? (r[foundCat] || "") : ""
  }));
}

async function pageWithOptionalImg(t, baseCols, imgCols = ["image_url", "image", "img", "photo_url"]) {
  for (const col of imgCols) {
    try {
      const { error } = await sb.from(t).select(col).limit(1);
      if (!error) {
        const rows = await page(t, `${baseCols},${col}`);
        return rows.map(r => ({ ...r, _img: r[col] || "" }));
      }
    } catch (e) {}
  }
  const rows = await page(t, baseCols);
  return rows.map(r => ({ ...r, _img: "" }));
}

function renderRes(append = false) {

    resEl.innerHTML = '<li class="empty">ไม่พบสินค้า ลองพิมพ์คำสั้นลง หรือเปลี่ยนหมวดหมู่</li>';

function add(s, u) {
  u = u || s.units[0];
  const avail = getAvailableStock(s);
  const L = cart.find(l => l.s.id === s.id && l.u.id === u.id);
  if (L) L.q = round2(L.q + 1);
  else cart.push({ s, u, q: 1, discRaw: "" });

  beep(avail < u.r ? "err" : "ok");
  $("#q").value = "";
  search();
  render();
  $("#q").focus();
}

const base = l => l.q * l.u.r;

// คำนวณส่วนลด (รองรับทั้งจำนวนบาท เช่น "20" และเปอร์เซ็นต์ เช่น "10%")
function parseDiscount(rawStr, baseAmount) {
  const str = String(rawStr ?? "").trim();
  if (!str) return 0;
  if (str.endsWith("%")) {
    const pct = Math.max(0, Math.min(100, parseFloat(str.slice(0, -1)) || 0));
    return round2(baseAmount * (pct / 100));
  }
  return round2(Math.max(0, Math.min(baseAmount, parseFloat(str) || 0)));
}

function getLineNet(l) {
  const gross = round2(l.q * l.u.p);
  const d = parseDiscount(l.discRaw, gross);
  return { gross, disc: d, net: round2(Math.max(0, gross - d)) };
}

const sub = () => round2(cart.reduce((a, l) => a + getLineNet(l).net, 0));
const getBillDisc = () => parseDiscount($("#disc").value, sub());
const total = () => round2(Math.max(0, sub() - getBillDisc()));

function setMethod(m) {
  method = m;
  document.querySelectorAll(".m").forEach(x => x.classList.toggle("on", x.dataset.m === m));

              ${l.s.units.map((u, j) => `<option value="${j}" ${u.id === l.u.id ? "selected" : ""}>${esc(u.n)}</option>`).join("")}

  $("#total").textContent = fmt(total());

  calc();

function validateCheckout() {
  if (!cart.length) return { ok: false, msg: "ยังไม่มีสินค้าในบิล", focus: "#q" };
  const t = total();
  if (method === "CASH" && $("#recv").value.trim() !== "") {
    const r = parseFloat($("#recv").value);
    if (isNaN(r) || r < t) return { ok: false, msg: `ยอดรับเงิน (${fmt(r || 0)}) น้อยกว่ายอดสุทธิ (${fmt(t)})`, focus: "#recv" };
  }
  if (method === "CREDIT" && !getSelectedPartyId()) {
    return { ok: false, msg: "กรุณาเลือกรายชื่อลูกค้าจากรายการสำหรับการขายเชื่อ", focus: "#party-input" };
  }
  return { ok: true };
}

function calc() {
  const t = total();
  const rawRecv = parseFloat($("#recv").value);
  const r = Math.max(0, isNaN(rawRecv) ? 0 : rawRecv);
  const check = validateCheckout();

  $("#cashrow").style.display = method === "CASH" ? "flex" : "none";
  $("#credrow").style.display = method === "CREDIT" ? "flex" : "none";
  $("#chg").textContent = fmt(Math.max(0, round2(r - t)));

  // เปิดให้กดปุ่มได้เสมอ เพื่อแจ้งเตือนเหตุผลที่บันทึกไม่ได้ (แทนการปิดปุ่มแบบเงียบๆ)
  $("#pay").classList.toggle("muted", !check.ok);
  $("#print-last").disabled = !lastDoc;
  $("#hold-btn").disabled = !cart.length;

  const holds = store.get("v2holds", []);
  $("#hold-cnt").textContent = holds.length;

  const n = store.get("v2out", []).length;
  $("#sync").textContent = n ? `⏳ ${n} บิลรอส่ง` : "✅ ซิงก์แล้ว";
}

function recallHoldBill(index) {
  const holds = store.get("v2holds", []);
  const h = holds[index];
  if (!h) return;
  if (cart.length > 0 && !confirm("มีสินค้าค้างอยู่ในบิลปัจจุบัน ต้องการทับรายการเดิมหรือไม่?")) return;

  const byId = new Map(SK.map(s => [s.id, s]));
  cart = h.items.map(it => {
    const s = byId.get(it.skuId);
    if (!s) return null;
    const u = s.units.find(x => x.id === it.unitId) || s.units[0];
    return { s, u, q: it.q, discRaw: it.discRaw || "" };
  }).filter(Boolean);

  $("#disc").value = h.disc || "";
  $("#party-input").value = h.party || "";
  setMethod(h.method || "CASH");

  holds.splice(index, 1);
  store.set("v2holds", holds);
  $("#dlg-hold").close();
  render();
  beep("ok");
  $("#msg").className = "";

}

// ===== 7. บันทึกบิล (พร้อม Double-Click Guard และแก้บั๊กยอดรับเงิน 0) =====
function pay() {
  if (payLock) return;
  const check = validateCheckout();
  if (!check.ok) {
    beep("err");
    $("#msg").className = "err";
    $("#msg").textContent = "⚠️ " + check.msg;
    if (check.focus) $(check.focus).focus();
    return;
  }

  payLock = true;
  setTimeout(() => { payLock = false; }, 350);

  const t0 = performance.now();
  const sTot = sub();
  const billDisc = getBillDisc();
  const tot = total();
  const partyId = method === "CREDIT" ? getSelectedPartyId() : null;
  const partyObj = partyId ? PARTIES.find(p => String(p.id) === String(partyId)) : null;

  // แก้บั๊ก: ตรวจสอบช่องรับเงินแบบชัดเจน (ถ้าเว้นว่างถือว่ารับพอดี แต่ถ้ากรอก 0 จะใช้ค่า 0)
  const rawRecvStr = $("#recv").value.trim();
  const recvVal = method === "CASH"
    ? (rawRecvStr === "" ? tot : Math.max(0, parseFloat(rawRecvStr) || 0))
    : tot;
  const chgVal = method === "CASH" ? Math.max(0, round2(recvVal - tot)) : 0;

  // คำนวณส่วนลดรวมทั้งหมด (ส่วนลดรายรายการ + ส่วนลดท้ายบิล) เพื่อส่งให้ Backend RPC
  const lineDiscTotal = round2(cart.reduce((sum, l) => sum + getLineNet(l).disc, 0));
  const totalCombinedDisc = round2(lineDiscTotal + billDisc);

  const doc = {
    cid: uid(),
    pm: method,
    party: partyId,
    partyName: partyObj ? partyObj.name : "",
    sub: round2(cart.reduce((sum, l) => sum + getLineNet(l).gross, 0)),
    disc: totalCombinedDisc,
    billDisc: billDisc,
    paid: method === "CREDIT" ? 0 : null,
    recv: recvVal,
    chg: chgVal,
    tot: tot,
    at: new Date().toLocaleString("th-TH"),
    ts: Date.now(),
    items: cart.map(l => {
      const ln = getLineNet(l);
      return {
        name: l.s.name,
        variant: l.s.v,
        unit: l.u.n,
        qty: l.q,
        price: l.u.p,
        disc: ln.disc,
        amount: ln.net
      };
    }),
    lines: cart.map(l => ({ sku_id: l.s.id, unit_id: l.u.id, qty: l.q }))
  };

  cart.forEach(l => l.s.stock = round2(l.s.stock - base(l)));
  const o = store.get("v2out", []);
  o.push(doc);
  store.set("v2out", o);

  // บันทึกประวัติยอดขายประจำกะ
  const shiftDocs = store.get("v2shift", []);
  shiftDocs.push(doc);
  store.set("v2shift", shiftDocs);

  lastDoc = doc;
  store.set("v2last", doc);

  beep("pay");
  resetCart(false);
  $("#msg").className = "";
  $("#msg").textContent = `✅ บันทึกบิล ${fmt(tot)} บาท สำเร็จ (${Math.round(performance.now() - t0)} ms)`;
  flush();
}

// ===== 8. ระบบซิงก์คิวบิล และ Retry บิลที่ไม่สำเร็จ =====
async function flush() {
  if (busy) return;
  busy = true;
  let syncedAny = false;
  try {
    for (;;) {
      const o = store.get("v2out", []);
      if (!o.length) break;
      const d = o[0];

      const { error } = await sb.rpc("post_doc", {
        p_client_id: d.cid,
        p_type: "SALE",
        p_party: d.party,
        p_discount: d.disc,
        p_pay_method: d.pm,
        p_paid: d.paid,
        p_lines: d.lines
      });

      const isTransient = error && (
        (!error.code && !error.hint && /fetch|network|Failed|timeout|abort/i.test(error.message)) ||
        [500, 502, 503, 504].includes(error.status)
      );
      if (isTransient) break;

      const rest = store.get("v2out", []).slice(1);
      store.set("v2out", rest);

      if (error) {
        const f = store.get("v2fail", []);
        f.push({ doc: d, at: d.at, tot: d.tot, err: error.message });
        store.set("v2fail", f);
        beep("err");
        $("#msg").className = "err";
        $("#msg").textContent = "มีบิลที่เซิร์ฟเวอร์ปฏิเสธ: " + error.message;
      } else {
        syncedAny = true;
      }
    }
  } finally {
    busy = false;
    calc();
    showFail();
    if (syncedAny) refresh(false); // อัปเดตสต็อกจริงจากฐานข้อมูลหลังซิงก์สำเร็จ
  }
}

function showFail() {
  const f = store.get("v2fail", []);
  $("#fail").style.display = f.length ? "block" : "none";
  $("#failn").textContent = `⚠️ ${f.length} บิลส่งไม่สำเร็จ (คลิกเพื่อดูรายละเอียดและลองส่งใหม่)`;
  $("#faill").innerHTML = f.map((x, idx) => `
    <li>
      <b>${esc(x.at)}</b> · ${fmt(x.tot)} บาท — <span class="low">${esc(x.err)}</span>
      ${x.doc ? `<button type="button" class="vbtn" style="margin-left:6px;padding:1px 6px" data-retry-one="${idx}">ส่งใหม่</button>` : ""}
    </li>
  `).join("");
}

function retryFailedBills(singleIndex = null) {
  const f = store.get("v2fail", []);
  if (!f.length) return;
  const out = store.get("v2out", []);

  if (singleIndex !== null) {
    const item = f[singleIndex];
    if (item && item.doc) {
      out.push(item.doc);
      f.splice(singleIndex, 1);
    }
  } else {
    f.forEach(item => { if (item.doc) out.push(item.doc); });
    f.length = 0;
  }

  store.set("v2out", out);
  store.set("v2fail", f);
  showFail();
  calc();
  flush();
}

// Infinite Scroll Listener
$("#res").addEventListener("scroll", e => {
  const el = e.target;
  if (el.scrollTop + el.clientHeight >= el.scrollHeight - 120) {
    if (renderLimit < hits.length) {
      renderLimit += 60;
      renderRes(true);
    }
  }
});

$("#q").addEventListener("input", search);
$("#q").addEventListener("keydown", e => {
  if (e.key === "ArrowDown") {
    sel = Math.min(sel + 1, hits.length - 1);
    if (sel >= renderLimit) { renderLimit = sel + 20; renderRes(true); }
    renderRes(false);
    const activeEl = $("#res li.on");
    if (activeEl) activeEl.scrollIntoView({ block: "nearest" });
    e.preventDefault();
  } else if (e.key === "ArrowUp") {
    sel = Math.max(sel - 1, 0);
    renderRes(false);
    const activeEl = $("#res li.on");
    if (activeEl) activeEl.scrollIntoView({ block: "nearest" });
    e.preventDefault();
  } else if (e.key === "Enter") {
    const v = e.target.value.trim();
    const b = BC.get(v);
    if (b && b.sku) {
      add(b.sku, b.u);
    } else {
      const c = SK.find(s => s.code.toLowerCase() === v.toLowerCase());
      if (c) add(c);
      else if (hits[sel] && v) add(hits[sel]);
      else if (v) beep("err");
    }
  }
});

});

});
$("#failx").onclick = () => {
  if (confirm("ยืนยันการล้างรายการบิลที่ไม่สำเร็จทั้งหมด? ข้อมูลเหล่านี้จะไม่ถูกส่งเข้าเซิร์ฟเวอร์")) {
    store.set("v2fail", []);
    showFail();
  }
};

document.addEventListener("keydown", e => {
  if (document.querySelector("dialog[open]")) return;
  if (e.key === "F2") { e.preventDefault(); $("#q").focus(); }
  if (e.key === "F4") { e.preventDefault(); holdCurrentBill(); }
  if (e.key === "F8") { e.preventDefault(); pay(); }
  if (e.key === "F9") { e.preventDefault(); printReceipt(lastDoc); }
  if (e.key === "Escape") { e.preventDefault(); resetCart(true); }
});

window.addEventListener("online", flush);
// Background Auto-Sync ทุก 20 วินาที
setInterval(() => { if (navigator.onLine) flush(); }, 20000);

// ===== เริ่มต้นระบบ =====
async function start(user) {
  await store.init(["v2cat", "v2parties", "v2out", "v2fail", "v2last", "v2view", "v2holds", "v2shift", "v2sound"]);

  viewMode = store.get("v2view", "grid");
  lastDoc = store.get("v2last", null);
  soundEnabled = store.get("v2sound", true);
  $("#sound-btn").classList.toggle("on", soundEnabled);
  $("#sound-btn").textContent = soundEnabled ? "🔊 เสียง" : "🔇 ปิดเสียง";

  $("#lg").style.display = "none";
  $("#app").style.display = "grid";
  $("#who").textContent = user.email;
  setViewMode(viewMode);

  const c = store.get("v2cat", null);
  if (c) {
    build(c);
    parties(store.get("v2parties", []));
    search();
    render();
  }

  const ok = await refresh(false);
  if (!ok && !c) {
    $("#msg").className = "err";
    $("#msg").textContent = "โหลดสินค้าไม่ได้ ตรวจอินเทอร์เน็ตแล้วเปิดใหม่";
  } else if (!ok) {
    $("#msg").textContent = "ออฟไลน์ ใช้ข้อมูลสินค้าที่บันทึกไว้ในเครื่อง";
  }

  showFail();
  flush();
  $("#q").focus();
}

$("#go").onclick = async () => {
  $("#go").disabled = true;
  $("#lerr").textContent = "";
  const { data, error } = await sb.auth.signInWithPassword({
    email: $("#em").value.trim(),
    password: $("#pw").value
  });
  $("#go").disabled = false;
  if (error) return $("#lerr").textContent = "เข้าสู่ระบบไม่ได้: " + error.message;
  start(data.user);
};

$("#pw").addEventListener("keydown", e => { if (e.key === "Enter") $("#go").click(); });
$("#out").onclick = async e => {
  e.preventDefault();
  await sb.auth.signOut();
  location.reload();
};

sb.auth.getSession().then(({ data }) => {
  if (data.session) start(data.session.user);
});
</script>
</body>
</html>
